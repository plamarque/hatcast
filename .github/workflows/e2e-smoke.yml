# E2E smoke V2 (Playwright + profil API e2e). Palier 2 CI — voir PLAN.md TEST-1.
# Réutilisable comme gate deploy staging : deploy-v2-cloud-run.yml (branche staging-v2 uniquement).
name: e2e-smoke (V2)

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-smoke.yml'
  push:
    branches: [v2, main]
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-smoke.yml'

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/api/build.gradle.kts
            services/api/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: apps/web
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
