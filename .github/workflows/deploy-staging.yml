name: Deploy to Staging

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'apps/web/**'
      - 'services/api/**'
      - 'docs/**'
      - '_bmad-output/**'
      - '.agents/**'
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Create environment file for staging
      run: |
        cat > .env << EOF
        VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
        VITE_ENVIRONMENT=staging
        VITE_FIRESTORE_DATABASE=staging
        VITE_STORAGE_PREFIX=staging/
        EOF
        
    - name: Update version.txt for staging
      run: |
        GIT_HASH=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date '+%Y-%m-%d')
        BUILD_TIME=$(date '+%Y-%m-%dT%H:%M:%S%z')
        cat > legacy/public/version.txt << EOF
        $(node -p "require('./legacy/package.json').version")
        Staging build - $BUILD_DATE
        Git: $GIT_HASH
        Build: $BUILD_TIME
        EOF
        
    - name: Ensure changelog files exist in public directory
      run: |
        if [ -f "changelog.json" ]; then
          cp changelog.json legacy/public/changelog.json
        fi
        if [ -f "CHANGELOG_FR.md" ]; then
          cp CHANGELOG_FR.md legacy/public/changelog_fr.md
        elif [ -f "CHANGELOG.md" ]; then
          cp CHANGELOG.md legacy/public/changelog.md
        elif [ -f "legacy/public/changelog.md" ]; then
          echo "changelog.md already exists in legacy/public/"
        else
          echo "# Changelog" > legacy/public/changelog.md
          echo "" >> legacy/public/changelog.md
          echo "Aucune nouveauté récente." >> legacy/public/changelog.md
        fi
      
    - name: Build application (legacy V1 client)
      run: npm run build
      
    - name: Copy changelog files to build directory
      run: |
        if [ -f "legacy/public/changelog.json" ]; then
          cp legacy/public/changelog.json legacy/dist/changelog.json
        fi
        if [ -f "legacy/public/changelog_fr.md" ]; then
          cp legacy/public/changelog_fr.md legacy/dist/changelog_fr.md
        elif [ -f "legacy/public/changelog.md" ]; then
          cp legacy/public/changelog.md legacy/dist/changelog.md
        else
          echo "# Changelog" > legacy/dist/changelog.md
          echo "" >> legacy/dist/changelog.md
          echo "Aucune nouveauté récente." >> legacy/dist/changelog.md
        fi
      
    - name: Deploy to Firebase Staging
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}'
        channelId: live
        projectId: impro-selector
        entryPoint: ./
        target: staging
        
    - name: Deploy Firebase Functions
      run: |
        npm install -g firebase-tools
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > service-account.json
        export GOOGLE_APPLICATION_CREDENTIALS="$PWD/service-account.json"
        cd functions && npm install
        cd .. && firebase deploy --only functions --force --project impro-selector
        
    - name: Deploy Firestore Rules to staging database
      run: |
        export GOOGLE_APPLICATION_CREDENTIALS="$PWD/service-account.json"
        # Déployer les règles sur la base staging
        echo "Deploying Firestore rules to staging database..."
        # Note: Firebase CLI ne supporte pas --database pour les règles
        # Les règles doivent être déployées manuellement via la console
        echo "⚠️ Firestore rules must be deployed manually via Firebase Console"
        echo "📋 Copy rules from default database to staging database"
        
    - name: Deploy Storage Rules
      run: |
        export GOOGLE_APPLICATION_CREDENTIALS="$PWD/service-account.json"
        firebase deploy --only storage --project impro-selector
        
    - name: Notify deployment success
      run: |
        echo "🚀 Déploiement STAGING réussi !"
        echo "🌐 URL: https://votre-projet-staging.web.app"
        echo "📧 Emails capturés via Ethereal Email"
