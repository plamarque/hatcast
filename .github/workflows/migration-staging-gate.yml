# Migration staging gate — après replay Malice complet (Neon staging).
# Non bloquant pour deploy : lancer manuellement après migrate-from-v1.sh / migrate:v2:run.
# Design: _bmad-output/test-artifacts/test-design-e1-cutover-preprod-gate.md §6 (UI golden)
name: Migration staging gate (Malice)

on:
  workflow_dispatch:
    inputs:
      strict_parity:
        description: >-
          Assert strict V1 parity (HATCAST_E2E_EVENTS_EXPECTED / DEPLACEMENTS_EXPECTED on staging env).
          Leave unchecked for structural + Playwright golden only.
        type: boolean
        default: false

concurrency:
  group: migration-staging-gate
  cancel-in-progress: false

jobs:
  migration-staging-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      BASE_URL: ${{ secrets.HATCAST_E2E_STAGING_BASE_URL }}
      PLAYWRIGHT_STAGING_E2E: '1'
      PLAYWRIGHT_BASE_URL: ${{ secrets.HATCAST_E2E_STAGING_BASE_URL }}
      PLAYWRIGHT_API_BASE_URL: ${{ secrets.HATCAST_E2E_STAGING_BASE_URL }}
      PLAYWRIGHT_REUSE_SERVERS: '1'
      HATCAST_E2E_ORGA_EMAIL: ${{ secrets.HATCAST_E2E_ORGA_EMAIL }}
      HATCAST_E2E_ORGA_PASSWORD: ${{ secrets.HATCAST_E2E_ORGA_PASSWORD }}
      HATCAST_E2E_MEMBER_EMAIL: ${{ secrets.HATCAST_E2E_MEMBER_EMAIL }}
      HATCAST_E2E_MEMBER_PASSWORD: ${{ secrets.HATCAST_E2E_MEMBER_PASSWORD }}
      HATCAST_E2E_TROUPE_SLUG: ${{ vars.HATCAST_E2E_TROUPE_SLUG }}
      HATCAST_E2E_SEASON_SLUG: ${{ vars.HATCAST_E2E_SEASON_SLUG }}
      HATCAST_E2E_MEMBER_SLUG: ${{ vars.HATCAST_E2E_MEMBER_SLUG }}
      HATCAST_E2E_EVENT_DISPOS_SLUG: ${{ vars.HATCAST_E2E_EVENT_DISPOS_SLUG }}
      HATCAST_E2E_EVENT_ACTIVITE_SLUG: ${{ vars.HATCAST_E2E_EVENT_ACTIVITE_SLUG }}
      HATCAST_E2E_EVENT_DRAW_SLUG: ${{ vars.HATCAST_E2E_EVENT_DRAW_SLUG }}
      HATCAST_E2E_EVENT_PENDING_SLUG: ${{ vars.HATCAST_E2E_EVENT_PENDING_SLUG }}
      HATCAST_DATASOURCE_URL: ${{ secrets.HATCAST_DATASOURCE_URL }}
      HATCAST_DATASOURCE_USERNAME: ${{ secrets.HATCAST_DATASOURCE_USERNAME }}
      HATCAST_DATASOURCE_PASSWORD: ${{ secrets.HATCAST_DATASOURCE_PASSWORD }}
      HATCAST_E2E_EVENTS_EXPECTED: ${{ inputs.strict_parity && vars.HATCAST_E2E_EVENTS_EXPECTED || '' }}
      HATCAST_E2E_EVENTS_TOLERANCE: ${{ inputs.strict_parity && vars.HATCAST_E2E_EVENTS_TOLERANCE || '' }}
      HATCAST_E2E_DEPLACEMENTS_EXPECTED: ${{ inputs.strict_parity && vars.HATCAST_E2E_DEPLACEMENTS_EXPECTED || '' }}
      HATCAST_E2E_DEPLACEMENTS_TOLERANCE: ${{ inputs.strict_parity && vars.HATCAST_E2E_DEPLACEMENTS_TOLERANCE || '' }}
    steps:
      - name: Check required configuration
        run: |
          set -euo pipefail
          test -n "${BASE_URL}" || (echo "Missing secret HATCAST_E2E_STAGING_BASE_URL" && exit 1)
          test -n "${HATCAST_E2E_MEMBER_EMAIL}" || (echo "Missing secret HATCAST_E2E_MEMBER_EMAIL" && exit 1)
          test -n "${HATCAST_E2E_MEMBER_PASSWORD}" || (echo "Missing secret HATCAST_E2E_MEMBER_PASSWORD" && exit 1)
          test -n "${HATCAST_E2E_ORGA_EMAIL}" || (echo "Missing secret HATCAST_E2E_ORGA_EMAIL" && exit 1)
          test -n "${HATCAST_E2E_ORGA_PASSWORD}" || (echo "Missing secret HATCAST_E2E_ORGA_PASSWORD" && exit 1)
          test -n "${HATCAST_E2E_SEASON_SLUG}" || (echo "Missing var HATCAST_E2E_SEASON_SLUG on environment staging" && exit 1)
          test -n "${HATCAST_E2E_MEMBER_SLUG}" || (echo "Missing var HATCAST_E2E_MEMBER_SLUG on environment staging" && exit 1)
          test -n "${HATCAST_DATASOURCE_URL}" || (echo "Missing secret HATCAST_DATASOURCE_URL (Neon staging)" && exit 1)
          test -n "${HATCAST_DATASOURCE_USERNAME}" || (echo "Missing secret HATCAST_DATASOURCE_USERNAME (Neon staging)" && exit 1)
          test -n "${HATCAST_DATASOURCE_PASSWORD}" || (echo "Missing secret HATCAST_DATASOURCE_PASSWORD (Neon staging)" && exit 1)

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm ci

      - name: Staging health check
        run: curl -fsS "${BASE_URL}/actuator/health" | head -c 500

      - name: Migration counts assert (E1 §6)
        run: node scripts/v2/e1-staging-migration-assert.mjs

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run migration Playwright gate (MIG-E2E golden Malice)
        working-directory: apps/web
        env:
          CI: 'true'
        run: npm run test:e2e:migration

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-staging-playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
