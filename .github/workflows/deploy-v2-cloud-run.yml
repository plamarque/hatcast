# Déploie l’image V2 (Nginx + Angular + Spring) vers Cloud Run.
# Prérequis : secrets dépôt + secrets par environnement GitHub — voir docs/v2/technical/DEPLOY_V2_CLOUD_RUN.md
# Branches : v2 → development, staging-v2 → staging. Production is tag-first (vX.Y.Z).
# Gate E2E smoke : staging-v2 branch push before staging deploy (RC tags = audit only, no CI).
# Gate E1 préprod (T2) : après deploy staging réussi — e1-preprod-gate.yml (mobile + orga + migration Malice).
# TEMP disabled (2026-06-05) — réactiver le job e1-preprod-gate quand E1-MEM-021 est vert.
# La branche git `staging` reste réservée au déploiement V1 (Firebase) — voir DEPLOY_V2_CLOUD_RUN.md.
# Noms configurables côté scripts : scripts/v2/branches.env (YAML GitHub = seconde source à maintenir).
name: Deploy V2 (Cloud Run)

on:
  workflow_dispatch:
  push:
    branches: [v2, staging-v2]
    # Prod tags only (vX.Y.Z). RC tags (*-rc.*) are audit for promote-tag-to-prod — no CI (GitHub forbids tags + tags-ignore together).
    tags-ignore:
      - '*-rc.*'
    paths:
      - 'package.json'
      - 'CHANGELOG.md'
      - 'CHANGELOG_FR.md'
      - 'apps/web/**'
      - 'services/api/**'
      - 'deploy/v2/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-v2-cloud-run.yml'

concurrency:
  group: deploy-v2-cloud-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  classify-ref:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.classify.outputs.target_env }}
      default_region: ${{ steps.classify.outputs.default_region }}
      default_service: ${{ steps.classify.outputs.default_service }}
      requires_smoke: ${{ steps.classify.outputs.requires_smoke }}
    steps:
      - name: Classify ref and enforce semver policy
        id: classify
        run: |
          set -euo pipefail
          ref_type="${GITHUB_REF_TYPE}"
          ref_name="${GITHUB_REF_NAME}"

          target_env=""
          default_region="europe-west9"
          default_service="hatcast-v2-dev"
          requires_smoke="false"

          if [[ "${ref_type}" == "branch" ]]; then
            case "${ref_name}" in
              v2)
                target_env="development"
                default_service="hatcast-v2-dev"
                ;;
              staging-v2)
                target_env="staging"
                default_service="hatcast-v2-staging"
                requires_smoke="true"
                ;;
              *)
                echo "❌ Unsupported branch for deploy workflow: ${ref_name}" >&2
                exit 1
                ;;
            esac
          elif [[ "${ref_type}" == "tag" ]]; then
            if [[ "${ref_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              target_env="production"
              default_region="europe-west1"
              default_service="hatcast-v2"
            elif [[ "${ref_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              target_env="staging"
              default_service="hatcast-v2-staging"
              requires_smoke="true"
            else
              echo "❌ Invalid semver tag format for deploy workflow: ${ref_name}" >&2
              echo "   Allowed tags: vX.Y.Z or vX.Y.Z-rc.N" >&2
              exit 1
            fi
          else
            echo "❌ Unsupported ref type for deploy workflow: ${ref_type}" >&2
            exit 1
          fi

          {
            echo "target_env=${target_env}"
            echo "default_region=${default_region}"
            echo "default_service=${default_service}"
            echo "requires_smoke=${requires_smoke}"
          } >> "${GITHUB_OUTPUT}"

  e2e-smoke:
    needs: classify-ref
    if: |
      needs.classify-ref.result == 'success' &&
      needs.classify-ref.outputs.requires_smoke == 'true'
    uses: ./.github/workflows/e2e-smoke.yml

  deploy:
    needs: [classify-ref, e2e-smoke]
    # always(): prod tags skip e2e-smoke; without it, deploy is skipped when the dependency is skipped.
    if: |
      always() &&
      needs.classify-ref.result == 'success' &&
      (
        needs.classify-ref.outputs.requires_smoke != 'true' ||
        needs.e2e-smoke.result == 'success'
      )
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.classify-ref.outputs.target_env }}
    env:
      # Defaults: prod tags (vX.Y.Z) -> europe-west1 (custom domain mapping),
      # v2/staging-v2/rc tags -> europe-west9. Can be overridden by env var GCP_REGION.
      GCP_REGION: ${{ vars.GCP_REGION || needs.classify-ref.outputs.default_region }}
      IMAGE_TAG: ${{ secrets.GCP_ARTIFACT_REGISTRY }}:${{ github.sha }}
      RELEASE_REF: ${{ github.ref_name }}
      # Par env : `CLOUD_RUN_SERVICE_NAME` dans l’environnement GitHub ; défauts hatcast-v2 / -staging / -dev
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME || needs.classify-ref.outputs.default_service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment context
        run: |
          echo "ref_type=${{ github.ref_type }}"
          echo "ref_name=${RELEASE_REF}"
          echo "service=${SERVICE_NAME}"
          echo "region=${GCP_REGION}"
          echo "image=${IMAGE_TAG}"

      - name: Check required secrets
        run: |
          test -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || (echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" || (echo "Missing GCP_SERVICE_ACCOUNT" && exit 1)
          test -n "${{ secrets.GCP_PROJECT_ID }}" || (echo "Missing GCP_PROJECT_ID" && exit 1)
          test -n "${{ secrets.GCP_ARTIFACT_REGISTRY }}" || (echo "Missing GCP_ARTIFACT_REGISTRY (ex. REGION-docker.pkg.dev/PROJECT/REPO/IMAGE)" && exit 1)
          test -n "${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}" || (echo "Missing GOOGLE_OAUTH_WEB_CLIENT_ID (build Angular)" && exit 1)
          test -n "${{ secrets.HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID }}" || (echo "Missing environment secret HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID" && exit 1)
          test -n "${{ secrets.HATCAST_DATASOURCE_URL }}" || (echo "Missing environment secret HATCAST_DATASOURCE_URL" && exit 1)
          test -n "${{ secrets.HATCAST_DATASOURCE_USERNAME }}" || (echo "Missing environment secret HATCAST_DATASOURCE_USERNAME" && exit 1)
          test -n "${{ secrets.HATCAST_DATASOURCE_PASSWORD }}" || (echo "Missing environment secret HATCAST_DATASOURCE_PASSWORD" && exit 1)
          test -n "${{ secrets.HATCAST_CORS_ALLOWED_ORIGINS }}" || (echo "Missing environment secret HATCAST_CORS_ALLOWED_ORIGINS" && exit 1)

      - name: Enforce OPS-8 production invariants
        if: |
          needs.classify-ref.outputs.target_env == 'production'
        run: |
          test "${GCP_REGION}" = "europe-west1" || (echo "production tag deploys must use europe-west1 for hatcast.app domain mapping" && exit 1)
          test "${{ secrets.HATCAST_CORS_ALLOWED_ORIGINS }}" = "https://hatcast.app" || (echo "production HATCAST_CORS_ALLOWED_ORIGINS must be https://hatcast.app" && exit 1)
          test -n "${{ secrets.HATCAST_SUPER_ADMIN_EMAILS }}" || (echo "production requires HATCAST_SUPER_ADMIN_EMAILS (comma-separated operator emails — never commit values)" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build \
            --build-arg GOOGLE_OAUTH_WEB_CLIENT_ID="${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}" \
            --build-arg HATCAST_FIREBASE_WEB_API_KEY="${{ secrets.HATCAST_FIREBASE_WEB_API_KEY }}" \
            --build-arg HATCAST_FIREBASE_AUTH_DOMAIN="${{ secrets.HATCAST_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg HATCAST_FIREBASE_PROJECT_ID="${{ secrets.HATCAST_FIREBASE_PROJECT_ID }}" \
            --build-arg HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY="${{ secrets.HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY }}" \
            --build-arg HATCAST_POSTHOG_PROJECT_API_KEY="${{ secrets.HATCAST_POSTHOG_PROJECT_API_KEY }}" \
            -t "${IMAGE_TAG}" \
            -t "${{ secrets.GCP_ARTIFACT_REGISTRY }}:latest" \
            -f Dockerfile \
            .
          docker push "${IMAGE_TAG}"
          docker push "${{ secrets.GCP_ARTIFACT_REGISTRY }}:latest"

      - name: Deploy to Cloud Run
        env:
          HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID }}
          HATCAST_DATASOURCE_URL: ${{ secrets.HATCAST_DATASOURCE_URL }}
          HATCAST_DATASOURCE_USERNAME: ${{ secrets.HATCAST_DATASOURCE_USERNAME }}
          HATCAST_DATASOURCE_PASSWORD: ${{ secrets.HATCAST_DATASOURCE_PASSWORD }}
          HATCAST_CORS_ALLOWED_ORIGINS: ${{ secrets.HATCAST_CORS_ALLOWED_ORIGINS }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          HATCAST_SUPER_ADMIN_EMAILS: ${{ secrets.HATCAST_SUPER_ADMIN_EMAILS }}
          HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY }}
          HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY }}
          HATCAST_WEB_PUSH_VAPID_SUBJECT: ${{ secrets.HATCAST_WEB_PUSH_VAPID_SUBJECT }}
          HATCAST_NOTIFICATION_EMAIL_ENABLED: ${{ secrets.HATCAST_NOTIFICATION_EMAIL_ENABLED }}
          HATCAST_NOTIFICATION_EMAIL_FROM: ${{ secrets.HATCAST_NOTIFICATION_EMAIL_FROM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_SENDING_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_SENDING_API_TOKEN }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}
          HATCAST_MIGRATION_API_KEY: ${{ secrets.HATCAST_MIGRATION_API_KEY }}
          HATCAST_MIGRATION_OPERATOR_EMAIL: ${{ secrets.HATCAST_MIGRATION_OPERATOR_EMAIL }}
          TARGET_ENV: ${{ needs.classify-ref.outputs.target_env }}
        run: |
          set -euo pipefail
          ENV_FILE="${RUNNER_TEMP}/cloudrun-env.yaml"
          : > "${ENV_FILE}"
          append_env() {
            local key="$1" val="$2"
            val="${val//\\/\\\\}"
            val="${val//\"/\\\"}"
            printf '%s: "%s"\n' "${key}" "${val}" >> "${ENV_FILE}"
          }
          append_env HATCAST_SPRING_PROFILE cloud
          append_env HATCAST_SERVER_PORT 8081
          append_env HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID "${HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID}"
          append_env HATCAST_DATASOURCE_URL "${HATCAST_DATASOURCE_URL}"
          append_env HATCAST_DATASOURCE_USERNAME "${HATCAST_DATASOURCE_USERNAME}"
          append_env HATCAST_DATASOURCE_PASSWORD "${HATCAST_DATASOURCE_PASSWORD}"
          append_env HATCAST_CORS_ALLOWED_ORIGINS "${HATCAST_CORS_ALLOWED_ORIGINS}"
          append_env GOOGLE_CLOUD_PROJECT "${GCP_PROJECT_ID}"
          if [ -n "${HATCAST_SUPER_ADMIN_EMAILS}" ]; then
            append_env HATCAST_SUPER_ADMIN_EMAILS "${HATCAST_SUPER_ADMIN_EMAILS}"
          else
            echo "::warning::HATCAST_SUPER_ADMIN_EMAILS not set — platform admin (join policy, admin routes) disabled until configured (see DEPLOY_V2_CLOUD_RUN.md)"
          fi
          if [ -n "${HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY}" ]; then
            append_env HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY "${HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY}"
          else
            echo "::warning::HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY not set — push opt-in on /compte will fail until configured (see DEPLOY_V2_CLOUD_RUN.md)"
          fi
          if [ -n "${HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY}" ]; then
            append_env HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY "${HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY}"
          else
            echo "::warning::HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY not set — server push send (story 8.3) disabled until configured"
          fi
          if [ -n "${HATCAST_WEB_PUSH_VAPID_SUBJECT}" ]; then
            append_env HATCAST_WEB_PUSH_VAPID_SUBJECT "${HATCAST_WEB_PUSH_VAPID_SUBJECT}"
          fi
          if [ -n "${HATCAST_NOTIFICATION_EMAIL_ENABLED}" ]; then
            append_env HATCAST_NOTIFICATION_EMAIL_ENABLED "${HATCAST_NOTIFICATION_EMAIL_ENABLED}"
          fi
          if [ -n "${HATCAST_NOTIFICATION_EMAIL_FROM}" ]; then
            append_env HATCAST_NOTIFICATION_EMAIL_FROM "${HATCAST_NOTIFICATION_EMAIL_FROM}"
          fi
          if [ -n "${SPRING_MAIL_HOST}" ]; then
            append_env SPRING_MAIL_HOST "${SPRING_MAIL_HOST}"
          fi
          if [ -n "${SPRING_MAIL_PORT}" ]; then
            append_env SPRING_MAIL_PORT "${SPRING_MAIL_PORT}"
          fi
          if [ -n "${SPRING_MAIL_USERNAME}" ]; then
            append_env SPRING_MAIL_USERNAME "${SPRING_MAIL_USERNAME}"
          fi
          if [ -n "${SPRING_MAIL_PASSWORD}" ]; then
            append_env SPRING_MAIL_PASSWORD "${SPRING_MAIL_PASSWORD}"
          fi
          if [ -n "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}" ]; then
            append_env SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}"
          fi
          if [ -n "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}" ]; then
            append_env SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE "${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}"
          fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            append_env CLOUDFLARE_ACCOUNT_ID "${CLOUDFLARE_ACCOUNT_ID}"
          fi
          if [ -n "${CLOUDFLARE_EMAIL_SENDING_API_TOKEN}" ]; then
            append_env CLOUDFLARE_EMAIL_SENDING_API_TOKEN "${CLOUDFLARE_EMAIL_SENDING_API_TOKEN}"
          fi
          if [ "${HATCAST_NOTIFICATION_EMAIL_ENABLED}" = "true" ]; then
            cf_ok=false
            smtp_ok=false
            if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] && [ -n "${CLOUDFLARE_EMAIL_SENDING_API_TOKEN}" ]; then
              cf_ok=true
            fi
            if [ -n "${SPRING_MAIL_HOST}" ] && [ -n "${SPRING_MAIL_USERNAME}" ] && [ -n "${SPRING_MAIL_PASSWORD}" ]; then
              smtp_ok=true
            fi
            if [ "${cf_ok}" = "false" ] && [ "${smtp_ok}" = "false" ]; then
              echo "::warning::HATCAST_NOTIFICATION_EMAIL_ENABLED=true but neither CLOUDFLARE_* (OPS-10) nor SPRING_MAIL_* complete — email send will be skipped (see DEPLOY_V2_CLOUD_RUN.md §7.6)"
            fi
          fi
          append_env JAVA_TOOL_OPTIONS -XX:MaxRAMPercentage=75.0
          if [ "${TARGET_ENV}" = "staging" ]; then
            if [ -n "${HATCAST_MIGRATION_API_KEY}" ] && [ -n "${HATCAST_MIGRATION_OPERATOR_EMAIL}" ]; then
              append_env HATCAST_MIGRATION_API_ENABLED true
              append_env HATCAST_MIGRATION_API_KEY "${HATCAST_MIGRATION_API_KEY}"
              append_env HATCAST_MIGRATION_OPERATOR_EMAIL "${HATCAST_MIGRATION_OPERATOR_EMAIL}"
            else
              echo "::warning::Migration API key not configured — headless migrate:v2:run will not work until HATCAST_MIGRATION_API_KEY and HATCAST_MIGRATION_OPERATOR_EMAIL are set on environment staging"
            fi
          fi
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE_TAG}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --startup-probe=initialDelaySeconds=0,timeoutSeconds=10,periodSeconds=10,failureThreshold=60,httpGet.path=/,httpGet.port=8080 \
            --env-vars-file="${ENV_FILE}"
          # --allow-unauthenticated peut échouer à appliquer IAM ; voir DEPLOY_V2_CLOUD_RUN.md §4.1
          gcloud run services add-iam-policy-binding "${SERVICE_NAME}" \
            --region "${GCP_REGION}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            || echo "::warning::Public invoker IAM not applied — set manually if users get 403 Forbidden"

  e1-preprod-gate:
    needs: [classify-ref, deploy]
    if: false
    uses: ./.github/workflows/e1-preprod-gate.yml
    secrets: inherit
