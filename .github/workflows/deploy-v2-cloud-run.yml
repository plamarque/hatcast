# Déploie l’image V2 (Nginx + Angular + Spring) vers Cloud Run.
# Prérequis : secrets dépôt + secrets par environnement GitHub — voir docs/v2/technical/DEPLOY_V2_CLOUD_RUN.md
# Branches : v2 → development, staging-v2 → staging. Production is tag-first (vX.Y.Z).
# Gate E2E smoke : staging-v2 branch + RC tags (vX.Y.Z-rc.N) before staging deploy.
# La branche git `staging` reste réservée au déploiement V1 (Firebase) — voir DEPLOY_V2_CLOUD_RUN.md.
# Noms configurables côté scripts : scripts/v2/branches.env (YAML GitHub = seconde source à maintenir).
name: Deploy V2 (Cloud Run)

on:
  workflow_dispatch:
  push:
    branches: [v2, staging-v2]
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'deploy/v2/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-v2-cloud-run.yml'

concurrency:
  group: deploy-v2-cloud-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  e2e-smoke:
    if: |
      github.ref_name == 'staging-v2' ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-rc.'))
    uses: ./.github/workflows/e2e-smoke.yml

  deploy:
    needs: e2e-smoke
    if: |
      always() &&
      (
        (
          github.ref_name != 'staging-v2' &&
          !(github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-rc.'))
        ) ||
        needs.e2e-smoke.result == 'success'
      )
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.') && 'production' || github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-rc.') && 'staging' || github.ref_name == 'staging-v2' && 'staging' || 'development' }}
    env:
      # Defaults: prod tags (vX.Y.Z) -> europe-west1 (custom domain mapping),
      # v2/staging-v2/rc tags -> europe-west9. Can be overridden by env var GCP_REGION.
      GCP_REGION: ${{ vars.GCP_REGION || ((github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.')) && 'europe-west1' || 'europe-west9') }}
      IMAGE_TAG: ${{ secrets.GCP_ARTIFACT_REGISTRY }}:${{ github.sha }}
      RELEASE_REF: ${{ github.ref_name }}
      # Par env : `CLOUD_RUN_SERVICE_NAME` dans l’environnement GitHub ; défauts hatcast-v2 / -staging / -dev
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.') && 'hatcast-v2' || github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-rc.') && 'hatcast-v2-staging' || github.ref_name == 'staging-v2' && 'hatcast-v2-staging' || 'hatcast-v2-dev') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment context
        run: |
          echo "ref_type=${{ github.ref_type }}"
          echo "ref_name=${RELEASE_REF}"
          echo "service=${SERVICE_NAME}"
          echo "region=${GCP_REGION}"
          echo "image=${IMAGE_TAG}"

      - name: Check required secrets
        run: |
          test -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || (echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT }}" || (echo "Missing GCP_SERVICE_ACCOUNT" && exit 1)
          test -n "${{ secrets.GCP_PROJECT_ID }}" || (echo "Missing GCP_PROJECT_ID" && exit 1)
          test -n "${{ secrets.GCP_ARTIFACT_REGISTRY }}" || (echo "Missing GCP_ARTIFACT_REGISTRY (ex. REGION-docker.pkg.dev/PROJECT/REPO/IMAGE)" && exit 1)
          test -n "${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}" || (echo "Missing GOOGLE_OAUTH_WEB_CLIENT_ID (build Angular)" && exit 1)
          test -n "${{ secrets.HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID }}" || (echo "Missing environment secret HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID" && exit 1)
          test -n "${{ secrets.HATCAST_DATASOURCE_URL }}" || (echo "Missing environment secret HATCAST_DATASOURCE_URL" && exit 1)
          test -n "${{ secrets.HATCAST_DATASOURCE_USERNAME }}" || (echo "Missing environment secret HATCAST_DATASOURCE_USERNAME" && exit 1)
          test -n "${{ secrets.HATCAST_DATASOURCE_PASSWORD }}" || (echo "Missing environment secret HATCAST_DATASOURCE_PASSWORD" && exit 1)
          test -n "${{ secrets.HATCAST_CORS_ALLOWED_ORIGINS }}" || (echo "Missing environment secret HATCAST_CORS_ALLOWED_ORIGINS" && exit 1)

      - name: Enforce OPS-8 production invariants
        if: |
          github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-rc.')
        run: |
          test "${GCP_REGION}" = "europe-west1" || (echo "production tag deploys must use europe-west1 for hatcast.app domain mapping" && exit 1)
          test "${{ secrets.HATCAST_CORS_ALLOWED_ORIGINS }}" = "https://hatcast.app" || (echo "production HATCAST_CORS_ALLOWED_ORIGINS must be https://hatcast.app" && exit 1)
          test -n "${{ secrets.HATCAST_SUPER_ADMIN_EMAILS }}" || (echo "production requires HATCAST_SUPER_ADMIN_EMAILS (comma-separated operator emails — never commit values)" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build \
            --build-arg GOOGLE_OAUTH_WEB_CLIENT_ID="${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}" \
            --build-arg HATCAST_FIREBASE_WEB_API_KEY="${{ secrets.HATCAST_FIREBASE_WEB_API_KEY }}" \
            --build-arg HATCAST_FIREBASE_AUTH_DOMAIN="${{ secrets.HATCAST_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg HATCAST_FIREBASE_PROJECT_ID="${{ secrets.HATCAST_FIREBASE_PROJECT_ID }}" \
            --build-arg HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY="${{ secrets.HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY }}" \
            -t "${IMAGE_TAG}" \
            -t "${{ secrets.GCP_ARTIFACT_REGISTRY }}:latest" \
            -f Dockerfile \
            .
          docker push "${IMAGE_TAG}"
          docker push "${{ secrets.GCP_ARTIFACT_REGISTRY }}:latest"

      - name: Deploy to Cloud Run
        run: |
          set -e
          V="HATCAST_SPRING_PROFILE=cloud"
          V="${V},HATCAST_SERVER_PORT=8081"
          V="${V},HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID }}"
          V="${V},HATCAST_DATASOURCE_URL=${{ secrets.HATCAST_DATASOURCE_URL }}"
          V="${V},HATCAST_DATASOURCE_USERNAME=${{ secrets.HATCAST_DATASOURCE_USERNAME }}"
          V="${V},HATCAST_DATASOURCE_PASSWORD=${{ secrets.HATCAST_DATASOURCE_PASSWORD }}"
          V="${V},HATCAST_CORS_ALLOWED_ORIGINS=${{ secrets.HATCAST_CORS_ALLOWED_ORIGINS }}"
          V="${V},GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}"
          if [ -n "${{ secrets.HATCAST_SUPER_ADMIN_EMAILS }}" ]; then
            V="${V},HATCAST_SUPER_ADMIN_EMAILS=${{ secrets.HATCAST_SUPER_ADMIN_EMAILS }}"
          else
            echo "::warning::HATCAST_SUPER_ADMIN_EMAILS not set — platform admin (join policy, admin routes) disabled until configured (see DEPLOY_V2_CLOUD_RUN.md)"
          fi
          if [ -n "${{ secrets.HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY }}" ]; then
            V="${V},HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY=${{ secrets.HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY }}"
          else
            echo "::warning::HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY not set — push opt-in on /compte will fail until configured (see DEPLOY_V2_CLOUD_RUN.md)"
          fi
          if [ -n "${{ secrets.HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY }}" ]; then
            V="${V},HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY=${{ secrets.HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY }}"
          else
            echo "::warning::HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY not set — server push send (story 8.3) disabled until configured"
          fi
          if [ -n "${{ secrets.HATCAST_WEB_PUSH_VAPID_SUBJECT }}" ]; then
            V="${V},HATCAST_WEB_PUSH_VAPID_SUBJECT=${{ secrets.HATCAST_WEB_PUSH_VAPID_SUBJECT }}"
          fi
          if [ -n "${{ secrets.HATCAST_NOTIFICATION_EMAIL_ENABLED }}" ]; then
            V="${V},HATCAST_NOTIFICATION_EMAIL_ENABLED=${{ secrets.HATCAST_NOTIFICATION_EMAIL_ENABLED }}"
          fi
          if [ -n "${{ secrets.HATCAST_NOTIFICATION_EMAIL_FROM }}" ]; then
            V="${V},HATCAST_NOTIFICATION_EMAIL_FROM=${{ secrets.HATCAST_NOTIFICATION_EMAIL_FROM }}"
          fi
          if [ -n "${{ secrets.SPRING_MAIL_HOST }}" ]; then
            V="${V},SPRING_MAIL_HOST=${{ secrets.SPRING_MAIL_HOST }}"
          fi
          if [ -n "${{ secrets.SPRING_MAIL_PORT }}" ]; then
            V="${V},SPRING_MAIL_PORT=${{ secrets.SPRING_MAIL_PORT }}"
          fi
          if [ -n "${{ secrets.SPRING_MAIL_USERNAME }}" ]; then
            V="${V},SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}"
          fi
          if [ -n "${{ secrets.SPRING_MAIL_PASSWORD }}" ]; then
            V="${V},SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}"
          fi
          if [ -n "${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}" ]; then
            V="${V},SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}"
          fi
          if [ -n "${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}" ]; then
            V="${V},SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}"
          fi
          if [ "${{ secrets.HATCAST_NOTIFICATION_EMAIL_ENABLED }}" = "true" ]; then
            if [ -z "${{ secrets.SPRING_MAIL_HOST }}" ] || [ -z "${{ secrets.SPRING_MAIL_USERNAME }}" ] || [ -z "${{ secrets.SPRING_MAIL_PASSWORD }}" ]; then
              echo "::warning::HATCAST_NOTIFICATION_EMAIL_ENABLED=true but SPRING_MAIL_HOST/USERNAME/PASSWORD incomplete — email send will be skipped (see DEPLOY_V2_CLOUD_RUN.md)"
            fi
          fi
          V="${V},JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0"
          if [ "${{ github.ref_name }}" = "staging-v2" ] || [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            if [ -n "${{ secrets.HATCAST_MIGRATION_API_KEY }}" ] && [ -n "${{ secrets.HATCAST_MIGRATION_OPERATOR_EMAIL }}" ]; then
              V="${V},HATCAST_MIGRATION_API_ENABLED=true"
              V="${V},HATCAST_MIGRATION_API_KEY=${{ secrets.HATCAST_MIGRATION_API_KEY }}"
              V="${V},HATCAST_MIGRATION_OPERATOR_EMAIL=${{ secrets.HATCAST_MIGRATION_OPERATOR_EMAIL }}"
            else
              echo "::warning::Migration API key not configured — headless migrate:v2:run will not work until HATCAST_MIGRATION_API_KEY and HATCAST_MIGRATION_OPERATOR_EMAIL are set on environment staging"
            fi
          fi
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE_TAG}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --startup-probe=initialDelaySeconds=0,timeoutSeconds=10,periodSeconds=10,failureThreshold=60,httpGet.path=/,httpGet.port=8080 \
            --set-env-vars="${V}"
          # --allow-unauthenticated peut échouer à appliquer IAM ; voir DEPLOY_V2_CLOUD_RUN.md §4.1
          gcloud run services add-iam-policy-binding "${SERVICE_NAME}" \
            --region "${GCP_REGION}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            || echo "::warning::Public invoker IAM not applied — set manually if users get 403 Forbidden"
