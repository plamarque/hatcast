# API integration tests (H2 test profile). Gate for M1 / OPS-2 — see services/api/README.md § Tests.
name: services/api (tests)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/api-test.yml'
  push:
    branches: [v2, main]
    paths:
      - 'services/api/**'
      - '.github/workflows/api-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run Gradle test suite
        run: ./gradlew test --no-daemon
