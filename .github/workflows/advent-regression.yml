name: Advent privacy regression

on:
  workflow_call:
  pull_request:
  push:

jobs:
  api-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/api/build.gradle.kts
            services/api/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Advent API security and game tests
        working-directory: services/api
        run: ./gradlew test --no-daemon --tests '*AdventMemberSecurityTest' --tests '*AdventMemberGameTest' --tests '*AdventOfflineIntegrationTest' --tests '*AdventMemberClockTest' --tests '*AdventParisTimeTest' --tests '*AdventRankingCalculatorTest' --tests '*AdventCloudPortraitTest' --tests '*AdventPortraitObjectTest'
      - name: Require all API suites to execute
        working-directory: services/api
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('AdventMemberSecurityTest', 'AdventMemberGameTest', 'AdventOfflineIntegrationTest', 'AdventMemberClockTest', 'AdventParisTimeTest', 'AdventRankingCalculatorTest', 'AdventCloudPortraitTest', 'AdventPortraitObjectTest'):
              matches = list(Path('build/test-results/test').glob(f'TEST-*{name}.xml'))
              if len(matches) != 1:
                  raise SystemExit(f'{name}: missing or ambiguous test report')
              suite = ET.parse(matches[0]).getroot()
              total, skipped = int(suite.get('tests', '0')), int(suite.get('skipped', '0'))
              print(f'{name}: {total} tests, {skipped} skipped')
              if not total or skipped:
                  raise SystemExit(f'{name}: no tests or skipped tests')
          PY
      - name: Advent unit tests
        working-directory: apps/web
        run: npm test -- --watch=false --include='**/advent-test.spec.ts'
      - name: Member shell unit tests
        working-directory: apps/web
        run: npm test -- --watch=false --include='**/member-shell.spec.ts'
      - name: Analytics privacy configuration
        working-directory: apps/web
        run: npm test -- --watch=false --include='**/posthog-browser.client.spec.ts'
      - name: Deployment configuration validation
        run: python3 scripts/v2/test-advent-config.py
      - name: Service-worker privacy configuration
        run: node apps/web/e2e/advent-isolation/check-service-worker-config.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Advent browser regression
        working-directory: apps/web
        env:
          CI: 'true'
        run: npx playwright test e2e/advent-member.spec.ts e2e/advent-isolation/advent-answer.spec.ts --project=chromium-advent-answer
      - name: Real PostHog payload privacy
        run: node apps/web/e2e/advent-isolation/posthog-privacy.smoke.cjs
      - name: Build production PWA
        working-directory: apps/web
        run: npm run build -- --configuration production
      - name: Active service-worker preview privacy
        working-directory: apps/web
        run: node e2e/advent-isolation/preview-service-worker.smoke.cjs
      - name: Real API preview and ordinary-member journey
        run: scripts/v2/run-advent-full-stack-smoke.sh
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: advent
          POSTGRES_USER: advent
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advent -d advent"
          --health-interval 10s --health-timeout 5s --health-retries 6
    env:
      ADVENT_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/advent
      ADVENT_TEST_POSTGRES_USER: advent
      ADVENT_TEST_POSTGRES_PASSWORD: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: PostgreSQL privacy and concurrency tests
        working-directory: services/api
        run: ./gradlew test --no-daemon --tests '*AdventMemberPostgresTest' --tests '*AdventRankingPostgresTest' --tests '*AdventResultPostgresTest'
      - name: Require all PostgreSQL suites to execute
        working-directory: services/api
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('AdventMemberPostgresTest', 'AdventRankingPostgresTest', 'AdventResultPostgresTest'):
              matches = list(Path('build/test-results/test').glob(f'TEST-*{name}.xml'))
              if len(matches) != 1:
                  raise SystemExit(f'{name}: missing or ambiguous test report')
              suite = ET.parse(matches[0]).getroot()
              total, skipped = int(suite.get('tests', '0')), int(suite.get('skipped', '0'))
              print(f'{name}: {total} tests, {skipped} skipped')
              if not total or skipped:
                  raise SystemExit(f'{name}: no tests or skipped tests')
          PY
