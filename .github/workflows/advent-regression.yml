name: Advent privacy regression

on:
  workflow_call:
  pull_request:
  push:

jobs:
  api-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/api/build.gradle.kts
            services/api/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Advent API security and game tests
        working-directory: services/api
        run: ./gradlew cleanTest test --no-daemon --tests '*AdventMemberSecurityTest' --tests '*AdventMemberGameTest' --tests '*AdventOfflineIntegrationTest' --tests '*AdventMemberClockTest' --tests '*AdventParisTimeTest' --tests '*AdventRankingCalculatorTest' --tests '*AdventCloudPortraitTest' --tests '*AdventPortraitObjectTest'
      - name: Require all API suites to execute
        if: always()
        run: >-
          python3 scripts/v2/ci/check_reports.py 'services/api/build/test-results/test/TEST-*.xml'
          AdventMemberSecurityTest AdventMemberGameTest AdventOfflineIntegrationTest
          AdventMemberClockTest AdventParisTimeTest AdventRankingCalculatorTest
          AdventCloudPortraitTest AdventPortraitObjectTest
      - name: Upload Advent API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advent-api-results
          path: services/api/build/test-results/test/
          if-no-files-found: warn
      - name: Advent unit tests
        working-directory: apps/web
        run: npm test -- --watch=false --include='**/advent-test.spec.ts' --reporters=junit --output-file=advent-angular-results.xml
      - name: Require Advent unit tests to execute
        if: always()
        run: python3 scripts/v2/ci/check_reports.py apps/web/advent-angular-results.xml src/app/pages/advent-test/advent-test.spec.ts
      - name: Upload Advent Angular report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advent-angular-results
          path: apps/web/advent-angular-results.xml
          if-no-files-found: warn
      - name: Check report validator
        run: python3 -m unittest discover -s scripts/v2/ci -p 'test_*.py'
      - name: Analytics privacy configuration
        working-directory: apps/web
        run: npm test -- --watch=false --include='**/posthog-browser.client.spec.ts'
      - name: Deployment configuration validation
        run: python3 scripts/v2/test-advent-config.py
      - name: Service-worker privacy configuration
        run: node apps/web/e2e/advent-isolation/check-service-worker-config.cjs
  member-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Member shell unit tests
        working-directory: apps/web
        run: npm test -- --watch=false --include='**/member-shell.spec.ts' --reporters=junit --output-file=member-shell-results.xml
      - name: Require member shell unit tests to execute
        if: always()
        run: python3 scripts/v2/ci/check_reports.py apps/web/member-shell-results.xml src/app/layout/member-shell/member-shell.spec.ts
      - name: Upload member shell report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-shell-results
          path: apps/web/member-shell-results.xml
          if-no-files-found: warn
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Advent browser regression
        working-directory: apps/web
        env:
          CI: 'true'
        run: npx playwright test e2e/advent-member.spec.ts e2e/advent-isolation/advent-answer.spec.ts --project=chromium-advent-answer
      - name: Real PostHog payload privacy
        run: node apps/web/e2e/advent-isolation/posthog-privacy.smoke.cjs
      - name: Build production PWA
        working-directory: apps/web
        run: npm run build -- --configuration production
      - name: Active service-worker preview privacy
        working-directory: apps/web
        run: node e2e/advent-isolation/preview-service-worker.smoke.cjs
      - name: Real API preview and ordinary-member journey
        run: scripts/v2/run-advent-full-stack-smoke.sh
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: advent
          POSTGRES_USER: advent
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advent -d advent"
          --health-interval 10s --health-timeout 5s --health-retries 6
    env:
      ADVENT_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/advent
      ADVENT_TEST_POSTGRES_USER: advent
      ADVENT_TEST_POSTGRES_PASSWORD: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: PostgreSQL privacy and concurrency tests
        working-directory: services/api
        run: ./gradlew cleanTest test --no-daemon --tests '*AdventMemberPostgresTest' --tests '*AdventRankingPostgresTest' --tests '*AdventResultPostgresTest'
      - name: Require all PostgreSQL suites to execute
        if: always()
        run: >-
          python3 scripts/v2/ci/check_reports.py 'services/api/build/test-results/test/TEST-*.xml'
          AdventMemberPostgresTest AdventRankingPostgresTest AdventResultPostgresTest
      - name: Upload Advent PostgreSQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advent-postgres-results
          path: services/api/build/test-results/test/
          if-no-files-found: warn
