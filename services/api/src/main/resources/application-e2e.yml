# Profil e2e : H2 en mémoire + seeds Flyway (fixtures déterministes Playwright V2).
# Démarrage : HATCAST_SPRING_PROFILE=e2e ./gradlew bootRun (voir apps/web/e2e/README.md).
spring:
  datasource:
    url: "jdbc:h2:mem:hatcast_e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed,classpath:db/seed-postgresql
    out-of-order: true
    repair-on-migrate: true
    placeholders:
      drop_event_availability_pk: DROP PRIMARY KEY
      notification_preferences_json_type: JSON
      notification_preferences_json_default: JSON '{}'
  session:
    jdbc:
      initialize-schema: always

hatcast:
  google:
    oauth-web-client-id: e2e-google-web-client-id
  auth:
    remember-me-seconds: 2592000
    no-remember-me-seconds: 1800
    super-admin-emails: e2e-admin@hatcast.test,patrice@seed.improbots.test
  cors:
    allowed-origins: http://localhost:4200,https://localhost:4200,http://127.0.0.1:4200,https://127.0.0.1:4200
  avatar:
    storage: local
    local-base-path: ${java.io.tmpdir}/hatcast-avatars-e2e
    max-bytes: 2097152
  e2e:
    api-enabled: true
    api-key: e2e-fixtures-secret
