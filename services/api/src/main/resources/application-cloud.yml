# Profil « cloud » : Cloud Run (Nginx devant l’API) + PostgreSQL sur Neon.
# Activer avec HATCAST_SPRING_PROFILE=cloud et variables d’environnement ci-dessous.
# JDBC typique Neon : jdbc:postgresql://HOST:5432/DB?sslmode=require (chaîne par branche Neon / environnement).
#
# Obligatoires en production :
#   HATCAST_DATASOURCE_URL, HATCAST_DATASOURCE_USERNAME, HATCAST_DATASOURCE_PASSWORD
#   HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID
#   HATCAST_CORS_ALLOWED_ORIGINS = origine publique exacte (ex. https://xxx.run.app)

spring:
  datasource:
    url: ${HATCAST_DATASOURCE_URL}
    username: ${HATCAST_DATASOURCE_USERNAME}
    password: ${HATCAST_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  session:
    jdbc:
      initialize-schema: always

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

hatcast:
  cors:
    allowed-origins: ${HATCAST_CORS_ALLOWED_ORIGINS}
