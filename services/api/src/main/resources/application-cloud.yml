# Profil Cloud Run : reverse proxy TLS + CORS production + cookie Secure.
# Base et Flyway : identiques à `application.yml` (Neon via HATCAST_DATASOURCE_*).
# Activer avec HATCAST_SPRING_PROFILE=cloud.

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

hatcast:
  cors:
    allowed-origins: ${HATCAST_CORS_ALLOWED_ORIGINS}
