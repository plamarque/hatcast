# Profil Cloud Run : reverse proxy TLS + CORS production + cookie Secure.
# Flyway : schéma uniquement (pas classpath:db/seed) — ADR-0014.
# Branche Neon « development » : schéma seul (pas de seeds) — voir ADR-0009.
# Activer avec HATCAST_SPRING_PROFILE=cloud.

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/migration-postgresql

# PERF-16: aggregated pool metrics only — no SQL text logging on cloud/prod.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    enable:
      jdbc: true
      hikaricp: true

hatcast:
  jdbc:
    metrics-enabled: false
    query-log-enabled: false
  cors:
    allowed-origins: ${HATCAST_CORS_ALLOWED_ORIGINS}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
