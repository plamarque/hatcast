# Runtime (dev local, CI ad hoc, etc.) : une seule base — PostgreSQL (Neon recommandé).
# Flyway applique les migrations sur cette URL ; Spring Session JDBC stocke les sessions ici.
# Variables obligatoires : HATCAST_DATASOURCE_URL, HATCAST_DATASOURCE_USERNAME, HATCAST_DATASOURCE_PASSWORD
spring:
  application:
    name: hatcast-api
  profiles:
    active: ${HATCAST_SPRING_PROFILE:dev}
  datasource:
    url: ${HATCAST_DATASOURCE_URL}
    username: ${HATCAST_DATASOURCE_USERNAME}
    password: ${HATCAST_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

server:
  port: ${HATCAST_SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: HATCAST_SESSION
        http-only: true
        same-site: lax

hatcast:
  google:
    oauth-web-client-id: ${HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID:}
  troupe:
    # Même UUID que l’INSERT Flyway V3 (troupe seed « La Malice »)
    # UUID alignée sur l’INSERT Flyway V3
    seed-troupe-id: ${HATCAST_SEED_TROUPE_ID:a0000001-0000-4000-8000-000000000001}
  auth:
    remember-me-seconds: ${HATCAST_AUTH_REMEMBER_ME_SECONDS:2592000}
    no-remember-me-seconds: ${HATCAST_AUTH_NO_REMEMBER_ME_SECONDS:1800}
    super-admin-emails: ${HATCAST_SUPER_ADMIN_EMAILS:}
  cors:
    allowed-origins: ${HATCAST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4200,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4200,https://localhost:5173,https://localhost:5174,https://localhost:4200}
  avatar:
    storage: ${HATCAST_AVATAR_STORAGE:local}
    local-base-path: ${HATCAST_AVATAR_LOCAL_PATH:${java.io.tmpdir}/hatcast-avatars}
    max-bytes: 2097152

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
