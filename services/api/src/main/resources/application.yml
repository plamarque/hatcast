# Runtime (dev local, CI ad hoc, etc.) : une seule base — PostgreSQL (Neon recommandé).
# Flyway applique les migrations sur cette URL ; Spring Session JDBC stocke les sessions ici.
# Variables obligatoires : HATCAST_DATASOURCE_URL, HATCAST_DATASOURCE_USERNAME, HATCAST_DATASOURCE_PASSWORD
spring:
  application:
    name: hatcast-api
  profiles:
    active: ${HATCAST_SPRING_PROFILE:dev}
  datasource:
    url: ${HATCAST_DATASOURCE_URL}
    username: ${HATCAST_DATASOURCE_USERNAME}
    password: ${HATCAST_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # V23: PostgreSQL rejects DROP PRIMARY KEY; H2 test profile overrides (application-test.yml).
      drop_event_availability_pk: DROP CONSTRAINT event_availability_pkey
      notification_preferences_json_type: JSONB
      notification_preferences_json_default: "'{}'::jsonb"
      draw_factor_config_json_type: JSONB
      draw_policy_rule_json_type: JSONB
      draw_policy_rules_json_type: JSONB
      draw_policy_rules_json_default: "'[]'::jsonb"
      draw_policies_season_idx_sql: CREATE INDEX IF NOT EXISTS draw_policies_season_idx ON draw_policies (season_id) WHERE season_id IS NOT NULL
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

server:
  port: ${HATCAST_SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: HATCAST_SESSION
        http-only: true
        same-site: lax

hatcast:
  google:
    oauth-web-client-id: ${HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID:}
  auth:
    remember-me-seconds: ${HATCAST_AUTH_REMEMBER_ME_SECONDS:2592000}
    no-remember-me-seconds: ${HATCAST_AUTH_NO_REMEMBER_ME_SECONDS:1800}
    super-admin-emails: ${HATCAST_SUPER_ADMIN_EMAILS:}
  cors:
    allowed-origins: ${HATCAST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4200,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4200,https://localhost:5173,https://localhost:5174,https://localhost:4200}
  avatar:
    storage: ${HATCAST_AVATAR_STORAGE:local}
    local-base-path: ${HATCAST_AVATAR_LOCAL_PATH:${java.io.tmpdir}/hatcast-avatars}
    max-bytes: 2097152
  migration:
    api-enabled: ${HATCAST_MIGRATION_API_ENABLED:false}
    api-key: ${HATCAST_MIGRATION_API_KEY:}
    operator-email: ${HATCAST_MIGRATION_OPERATOR_EMAIL:}
  web-push:
    vapid-public-key: ${HATCAST_WEB_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${HATCAST_WEB_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${HATCAST_WEB_PUSH_VAPID_SUBJECT:mailto:contact@hatcast.app}
  notification:
    reminder-cron: ${HATCAST_NOTIFICATION_REMINDER_CRON:0 0 8 * * *}
    availability-pending-reminder-cron: ${HATCAST_NOTIFICATION_AVAILABILITY_PENDING_REMINDER_CRON:0 0 9 * * *}
    availability-pending-horizon-days: ${HATCAST_NOTIFICATION_AVAILABILITY_PENDING_HORIZON_DAYS:21}
    availability-pending-cadence-days: ${HATCAST_NOTIFICATION_AVAILABILITY_PENDING_CADENCE_DAYS:5}
    email:
      enabled: ${HATCAST_NOTIFICATION_EMAIL_ENABLED:false}
      from: ${HATCAST_NOTIFICATION_EMAIL_FROM:HatCast <noreply@hatcast.app>}
      public-web-origin: ${HATCAST_WEB_PUBLIC_ORIGIN:https://localhost:4200}
      cloudflare:
        account-id: ${CLOUDFLARE_ACCOUNT_ID:}
        api-token: ${CLOUDFLARE_EMAIL_SENDING_API_TOKEN:}
  notifications:
    manual-availability-nudge-guard-days: ${HATCAST_MANUAL_AVAILABILITY_NUDGE_GUARD_DAYS:3}
  jdbc:
    metrics-enabled: ${HATCAST_JDBC_METRICS_ENABLED:false}
    query-log-enabled: ${HATCAST_DB_QUERY_LOG:false}
    slow-query-threshold-ms: ${HATCAST_JDBC_SLOW_QUERY_MS:100}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
