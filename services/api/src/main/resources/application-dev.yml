# Profil dev local (HATCAST_SPRING_PROFILE=dev, défaut dans application.yml).
# Seeds Flyway : db/seed (troupe/saison V3_1/V4 + stubs) + db/seed-postgresql (R__seed_improbots_dev_demo.sql).
# Regénération : npm run generate:improbots-dev-seed — repair-on-migrate aligne les checksums Flyway.
# Super-admin : HATCAST_SUPER_ADMIN_EMAILS dans .env local (voir .env.example) — pas de défaut commité.
#
# Mail optionnel en local (Mailpit via start-dev.sh) : pas de health check SMTP sur actuator/health.
# OPS-12: same Neon idle policy as cloud when .env points at branche `local` (prefer --offline to save CU-h).
management:
  health:
    mail:
      enabled: false
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    enable:
      jdbc: true
      hikaricp: true

hatcast:
  jdbc:
    metrics-enabled: true
    query-log-enabled: ${HATCAST_DB_QUERY_LOG:false}
    slow-query-threshold-ms: ${HATCAST_JDBC_SLOW_QUERY_MS:100}

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/migration-postgresql,classpath:db/seed,classpath:db/seed-postgresql
    # Seeds déplacés dans db/seed (OPS-1) : V3_1 peut arriver après V4+ sur une base Neon déjà migrée.
    out-of-order: true
    repair-on-migrate: true
  # OPS-12 / BUG-013: allow Neon scale-to-zero on branche `local` (H2 offline unaffected).
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 280000
      connection-timeout: 20000
  # Default Spring Session cleanup is every minute (SQL) and would keep Neon awake.
  session:
    jdbc:
      cleanup-cron: "0 30 3 * * *"

# Logs lisibles en dev : stacktrace courte en console, WARN sans stack dans .cursor/hatcast-api-warnings.log
logging:
  exception-conversion-word: "%wEx{2}"
  file:
    name: ../../.cursor/hatcast-api-dev.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 3
