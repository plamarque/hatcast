# Profil offline : H2 fichier local + seeds Flyway (sans Neon / sans internet).
# Démarrage : ./scripts/start-dev.sh --offline  (HATCAST_SPRING_PROFILE=dev,offline)
spring:
  datasource:
    url: "jdbc:h2:file:${user.dir}/../../.local/hatcast-offline/hatcast;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed,classpath:db/seed-postgresql
    out-of-order: true
    repair-on-migrate: true
    placeholders:
      drop_event_availability_pk: DROP PRIMARY KEY
      notification_preferences_json_type: JSON
      notification_preferences_json_default: JSON '{}'
      draw_factor_config_json_type: JSON
      draw_policy_rule_json_type: JSON
      draw_policy_rules_json_type: JSON
      draw_policy_rules_json_default: JSON '[]'
      draw_policies_season_idx_sql: CREATE INDEX draw_policies_season_idx ON draw_policies (season_id)
  session:
    jdbc:
      initialize-schema: always

hatcast:
  google:
    oauth-web-client-id: ${HATCAST_GOOGLE_OAUTH_WEB_CLIENT_ID:offline-google-web-client-id}
  auth:
    remember-me-seconds: 2592000
    no-remember-me-seconds: 1800
    super-admin-emails: ${HATCAST_SUPER_ADMIN_EMAILS:patrice@seed.improbots.test}
  cors:
    allowed-origins: http://localhost:4200,https://localhost:4200,http://127.0.0.1:4200,https://127.0.0.1:4200
  avatar:
    storage: local
    local-base-path: ${java.io.tmpdir}/hatcast-avatars-offline
    max-bytes: 2097152
