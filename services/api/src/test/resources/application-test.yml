# Profil test : H2 en mémoire uniquement pour CI / `./gradlew test` (pas Neon, pas de Flyway sur une 2e base).
# Le runtime (dev/cloud) utilise toujours PostgreSQL (Neon).
spring:
  datasource:
    url: "jdbc:h2:mem:hatcast_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    placeholders:
      drop_event_availability_pk: DROP PRIMARY KEY
  session:
    jdbc:
      initialize-schema: always

hatcast:
  google:
    oauth-web-client-id: test-google-web-client-id
  troupe:
    seed-troupe-id: a0000001-0000-4000-8000-000000000001
  auth:
    remember-me-seconds: 2592000
    no-remember-me-seconds: 1800
    super-admin-emails: platform-admin@hatcast.test
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:4200
  avatar:
    storage: local
    local-base-path: ${java.io.tmpdir}/hatcast-avatars-test
    max-bytes: 2097152
