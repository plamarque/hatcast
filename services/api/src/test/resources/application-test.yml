# Profil test : H2 en mémoire uniquement pour CI / `./gradlew test` (pas Neon, pas de Flyway sur une 2e base).
# Le runtime (dev/cloud) utilise toujours PostgreSQL (Neon).
spring:
  datasource:
    url: "jdbc:h2:mem:hatcast_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        # Perf gates (MeInboxPerformanceIntegrationTest, etc.) use wall-clock headers, not Hibernate stats.
        generate_statistics: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed,classpath:db/seed-postgresql
    placeholders:
      drop_event_availability_pk: DROP PRIMARY KEY
      notification_preferences_json_type: JSON
      notification_preferences_json_default: JSON '{}'
      draw_factor_config_json_type: JSON
      draw_policy_rule_json_type: JSON
      draw_policy_rules_json_type: JSON
      draw_policy_rules_json_default: JSON '[]'
      draw_policies_season_idx_sql: CREATE INDEX IF NOT EXISTS draw_policies_season_idx ON draw_policies (season_id)
  session:
    jdbc:
      initialize-schema: always
  test:
    context:
      cache:
        # ~70 @SpringBootTest variants; default maxSize=32 keeps too many full contexts alive → tail OOM/GC thrash.
        maxSize: 4

hatcast:
  google:
    oauth-web-client-id: test-google-web-client-id
  auth:
    remember-me-seconds: 2592000
    no-remember-me-seconds: 1800
    super-admin-emails: platform-admin@hatcast.test,platform-members-admin@hatcast.test
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:4200
  avatar:
    storage: local
    local-base-path: ${java.io.tmpdir}/hatcast-avatars-test
    max-bytes: 2097152
