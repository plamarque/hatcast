openapi: 3.0.3
info:
  title: HatCast API — Disponibilités (fragment)
  description: >
    Saisie de disponibilité par événement pour le membre connecté.
    Trois états API : available, unavailable, unknown (absence de ligne en base).
  version: 0.1.0

servers:
  - url: https://{apiHost}/v1
    variables:
      apiHost:
        default: localhost:8080

tags:
  - name: Disponibilités

paths:
  /seasons/{seasonId}/events/{eventId}/availability/me:
    get:
      tags: [Disponibilités]
      summary: Lire ma disponibilité pour un spectacle
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAvailabilityResponse'
        '401':
          description: Non authentifié
        '403':
          description: Utilisateur non membre actif de la troupe
        '404':
          description: Saison ou événement inconnu
    put:
      tags: [Disponibilités]
      summary: Enregistrer ma disponibilité pour un spectacle
      description: >
        `unknown` supprime toute ligne existante (Non renseigné).
        PUT idempotent pour available/unavailable. Quand `status = available`,
        `roleKeys` contient les rôles requis sur lesquels le membre se propose.
        Si la couverture bénévole obligatoire s'applique et que `player` est
        envoyé, `volunteer` est ajouté sauf si `applyVolunteerRule` vaut `false`
        pour refléter une décochage explicite côté client.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMyAvailabilityRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAvailabilityResponse'
        '400':
          description: status invalide ou roleKeys hors des rôles requis
        '401':
          description: Non authentifié
        '403':
          description: Utilisateur non membre actif de la troupe
        '404':
          description: Saison ou événement inconnu

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: HATCAST_SESSION

  parameters:
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    AvailabilityStatus:
      type: string
      enum: [available, unavailable, unknown]

    MyAvailabilityResponse:
      type: object
      required: [status, roleKeys]
      properties:
        status:
          $ref: '#/components/schemas/AvailabilityStatus'
        updatedAt:
          type: string
          format: date-time
          nullable: true
        roleKeys:
          type: array
          description: >
            Rôles requis sur lesquels le membre est disponible. Toujours présent ;
            vide pour unavailable/unknown ou pour une disponibilité générale.
          items:
            type: string

    SetMyAvailabilityRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AvailabilityStatus'
        roleKeys:
          type: array
          description: >
            Rôles à persister quand `status = available`. Les clés doivent faire
            partie des rôles requis de l'événement avec un nombre de slots > 0.
            Ignoré et vidé pour unavailable/unknown.
          items:
            type: string
        applyVolunteerRule:
          type: boolean
          default: true
          description: >
            Applique l'auto-ajout de `volunteer` quand un rôle de jeu est coché
            et que l'événement requiert des bénévoles. Passer `false` uniquement
            quand l'utilisateur a explicitement décoché `volunteer`.
