openapi: 3.0.3
info:
  title: HatCast API — Participants (fragment)
  description: >
    Rosters participants saison et spectacle (story 3.8). Les champs email sont réservés aux appels admin autorisés.
    Mutations : cookie session + CSRF `X-XSRF-TOKEN`.
  version: 0.1.0

tags:
  - name: Participants

paths:
  /seasons/{seasonId}/participants:
    get:
      tags: [Participants]
      summary: Liste admin des participants de saison
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
      responses:
        '200':
          description: OK (emails si autorisé)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeasonParticipantAdmin'
        '403':
          description: Accès refusé
    post:
      tags: [Participants]
      summary: Ajouter (ou réintégrer) un participant de saison (nom ± email)
      description: >-
        Sert aussi de ré-inclusion : si la personne avait été retirée du roster
        (reconnue par utilisateur lié, sinon email, sinon nom d'affichage), la
        même ligne (`season_participant_id`) est réactivée au lieu de créer un
        doublon — l'historique (dispos/compositions) réapparaît. Pour un membre
        synchronisé, le nom/email sont resynchronisés depuis l'adhésion.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantCreateRequest'
      responses:
        '200':
          description: Créé ou réintégré (même ligne réactivée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonParticipantAdmin'
        '400':
          description: Réintégration d'un membre dont l'adhésion troupe est INACTIVE (réactiver l'adhésion d'abord)
        '403':
          description: Accès refusé
        '409':
          description: Nom en doublon

  /seasons/{seasonId}/participants/{participantId}:
    patch:
      tags: [Participants]
      summary: Mettre à jour un participant explicite (non membre sync)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
        - $ref: '#/components/parameters/participantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantUpdateRequest'
      responses:
        '200':
          description: OK
        '403':
          description: Accès refusé
        '404':
          description: Inconnu
    delete:
      tags: [Participants]
      summary: Retirer (soft delete) un participant de saison
      description: >
        Retire un participant explicite ou un membre synchronisé depuis la troupe.
        Pour les membres (`troupeMembershipId`), l'adhésion troupe reste active ;
        seul le roster de cette saison est filtré (`removal_source = SEASON_ADMIN`).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
        - $ref: '#/components/parameters/participantId'
      responses:
        '204':
          description: Retiré
        '403':
          description: Accès refusé
        '404':
          description: Inconnu

  /seasons/{seasonId}/participants/{participantId}/reinclude:
    post:
      tags: [Participants]
      summary: Réintégrer un participant retiré de la saison
      description: >
        Réactive le même `season_participant_id` (historique conservé).
        Idempotent si déjà actif.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
        - $ref: '#/components/parameters/participantId'
      responses:
        '204':
          description: Réintégré
        '400':
          description: Adhésion troupe inactive
        '409':
          description: Adhésion troupe désactivée entre-temps (concurrence)
        '403':
          description: Accès refusé
        '404':
          description: Inconnu

  /seasons/{seasonId}/participants/selectors:
    get:
      tags: [Participants]
      summary: Liste réduite pour filtres agenda (sans email)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipantSelector'

  /seasons/{seasonId}/events/{eventId}/participants:
    get:
      tags: [Participants]
      summary: Liste admin participants spectacle
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
        - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventParticipantAdmin'
        '403':
          description: Accès refusé
    post:
      tags: [Participants]
      summary: Ajouter un participant dédié au spectacle
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
        - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantCreateRequest'
      responses:
        '200':
          description: Créé
        '403':
          description: Accès refusé

  /seasons/{seasonId}/events/{eventId}/participants/{participantId}:
    delete:
      tags: [Participants]
      summary: Retirer un participant spectacle (soft delete)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/seasonId'
        - $ref: '#/components/parameters/eventId'
        - $ref: '#/components/parameters/participantId'
      responses:
        '204':
          description: Retiré
        '403':
          description: Accès refusé

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: HATCAST_SESSION

  parameters:
    seasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    participantId:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ParticipantCreateRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        gender:
          type: string
          enum: [male, female, non_specified]
          nullable: true
          description: Organizer-set row gender when account has no M/F (ADR 0020)
        invitationScope:
          $ref: '#/components/schemas/InvitationScope'
          nullable: true
          description: Server default by endpoint; ignored for troupe member adds
        addToSeasonRoster:
          type: boolean
          default: false
          description: Event create only — opt-in season row with EVENT scope
        troupeMembershipId:
          type: string
          format: uuid
          nullable: true
          description: Optional explicit carnet pick (prep 3.8d)

    ParticipantUpdateRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        gender:
          type: string
          enum: [male, female, non_specified]
          nullable: true
          description: Organizer-set row gender when account has no M/F (ADR 0020)

    InvitationScope:
      type: string
      enum: [SEASON, EVENT]

    ParticipantKind:
      type: string
      enum: [MEMBER, EXTERNE, LINKED, MANAGED, NAME_ONLY]

    SeasonParticipantAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          nullable: true
          description: Admin only
        userId:
          type: string
          format: uuid
          nullable: true
        troupeMembershipId:
          type: string
          format: uuid
          nullable: true
        invitationScope:
          $ref: '#/components/schemas/InvitationScope'
          nullable: true
        kind:
          $ref: '#/components/schemas/ParticipantKind'
        status:
          type: string
          enum: [ACTIVE, REMOVED]
        removable:
          type: boolean
        gender:
          type: string
          enum: [male, female, non_specified]
          description: Effective gender (account precedence, then row)
        participantGender:
          type: string
          enum: [male, female, non_specified]
          nullable: true
          description: Stored organizer value on row; null when unset
        genderManagedOnAccount:
          type: boolean
          description: True when linked account M/F blocks organizer override

    EventParticipantAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          nullable: true
        userId:
          type: string
          format: uuid
          nullable: true
        kind:
          $ref: '#/components/schemas/ParticipantKind'
        status:
          type: string
          enum: [ACTIVE, REMOVED]
        gender:
          type: string
          enum: [male, female, non_specified]
        participantGender:
          type: string
          enum: [male, female, non_specified]
          nullable: true
        genderManagedOnAccount:
          type: boolean

    ParticipantSelector:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/ParticipantKind'
        userId:
          type: string
          format: uuid
          nullable: true
