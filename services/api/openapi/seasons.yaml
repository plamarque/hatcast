openapi: 3.0.3
info:
  title: HatCast API — Troupes et saisons (fragment)
  description: >
    Contrat pour la gestion des troupes, adhésions membres et saisons V2 (Postgres, session cookie).
    `GET /troupes` retourne uniquement les troupes où l'utilisateur connecté a une adhésion active.
    Pagination liste : paramètres `page` (0-based) et `size` (défaut côté client 20, max 100 côté API).
    Les mutations exigent le cookie de session et l’en-tête CSRF `X-XSRF-TOKEN` (voir Spring Security).
    Gestion provisoire (seed) : un membre actif de la troupe seed peut créer/modifier saisons et événements
    jusqu’à l’Epic 2 Story 2.2 (rôles de base).
  version: 0.1.0

servers:
  - url: https://{apiHost}/v1
    variables:
      apiHost:
        default: localhost:8080

tags:
  - name: Troupes
  - name: Saisons
  - name: Organisateurs

paths:
  /troupes:
    get:
      tags: [Troupes]
      summary: Liste des troupes où l'utilisateur est membre actif
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK (tableau vide si aucune adhésion active)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TroupeListItem'
        '401':
          description: Non authentifié

  /troupes/{troupeId}/memberships/me:
    get:
      tags: [Troupes]
      summary: Adhésion de l'utilisateur courant à une troupe
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSummary'
        '404':
          description: Pas membre actif de cette troupe
        '403':
          description: Accès refusé

    post:
      tags: [Troupes]
      summary: Rejoindre la troupe de démonstration (adhésion active pour l'utilisateur courant)
      description: >
        Flux provisoire Story 2.1 limité à la troupe seed/démonstration jusqu'aux invitations
        et rôles de la Story 2.2. Idempotent : une seconde invocation réactive ou retourne l'adhésion existante.
        Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Adhésion créée ou déjà active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSummary'
        '404':
          description: Troupe inconnue
        '403':
          description: Adhésion directe refusée hors troupe de démonstration, ou CSRF/session invalide

  /troupes/{troupeId}/seasons:
    get:
      tags: [Saisons]
      summary: Liste paginée des saisons d’une troupe
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSeasons'
        '403':
          description: Utilisateur non membre actif de la troupe

    post:
      tags: [Saisons]
      summary: Créer une saison
      description: >
        Le champ `slug` n’est pas fourni par le client : il est dérivé du titre (normalisation Unicode,
        minuscules, tirets) puis rendu unique dans la troupe (`slug`, `slug-2`, `slug-3`, … si besoin).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeasonRequest'
      responses:
        '200':
          description: Saison créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          description: Validation (titre vide ou ne permettant pas de générer un slug)

  /troupes/{troupeId}/seasons/by-slug/{slug}:
    get:
      tags: [Saisons]
      summary: Détail d’une saison par slug (navigation `/saison/:slug`)
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '404':
          description: Saison inconnue
        '403':
          description: Utilisateur non membre actif de la troupe

  /seasons/{seasonId}:
    get:
      tags: [Saisons]
      summary: Détail d’une saison
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '403':
          description: Utilisateur non membre actif de la troupe de la saison
        '404':
          description: Saison inconnue

    patch:
      tags: [Saisons]
      summary: Mettre à jour une saison
      description: >
        Mise à jour partielle : une propriété **absente** du corps n’est pas modifiée.
        Une propriété **présente avec la valeur JSON `null`** efface les champs optionnels
        (`description`, `startDate`, `endDate`). Le titre ne peut pas être effacé : `title: null`
        est rejeté (400). Si le titre change, le `slug` est régénéré à partir du nouveau titre
        avec la même règle d’unicité qu’à la création (en excluant la saison courante du test de collision).
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSeasonRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

  /seasons/{seasonId}/actions/archive:
    post:
      tags: [Saisons]
      summary: Archiver une saison (inactive)
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

  /seasons/{seasonId}/actions/activate:
    post:
      tags: [Saisons]
      summary: Activer une saison (désactive les autres actives de la même troupe)
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

  /seasons/{seasonId}/organizers:
    get:
      tags: [Organisateurs]
      summary: Lister les organisateur·ices de saison
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organizer'
        '403':
          description: Accès refusé
    post:
      tags: [Organisateurs]
      summary: Ajouter un·e organisateur·ice de saison
      description: Email normalisé (trim + lowercase) ; ajout idempotent.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerAssignmentRequest'
      responses:
        '200':
          description: Organisateur·ice ajouté·e ou déjà présent·e
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizer'
        '403':
          description: Accès refusé
        '404':
          description: Utilisateur introuvable pour cet email

  /seasons/{seasonId}/organizers/{userId}:
    delete:
      tags: [Organisateurs]
      summary: Retirer un·e organisateur·ice de saison
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Retiré ou déjà absent
        '403':
          description: Accès refusé

  /seasons/{seasonId}/permissions/me:
    get:
      tags: [Organisateurs]
      summary: Permissions organisateur de l’utilisateur courant sur une saison
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySeasonPermissions'
        '403':
          description: Utilisateur non membre actif de la troupe de la saison
        '404':
          description: Saison inconnue

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: HATCAST_SESSION

  parameters:
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    TroupeListItem:
      type: object
      required: [id, name, slug, membership]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        membership:
          $ref: '#/components/schemas/MembershipSummary'

    MembershipSummary:
      type: object
      required: [id, displayName, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Season:
      type: object
      properties:
        id:
          type: string
          format: uuid
        troupeId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        archived:
          type: boolean
        active:
          type: boolean
        eventCount:
          type: integer
        participantCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedSeasons:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Season'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    CreateSeasonRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    UpdateSeasonRequest:
      type: object
      description: >
        Champs optionnels : omettre une clé pour ne pas la modifier ; inclure la clé avec `null`
        pour effacer `description`, `startDate` ou `endDate`. Pour `title`, `null` n’est pas autorisé.
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true

    OrganizerAssignmentRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email utilisateur ; trim + lowercase côté serveur.

    Organizer:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
          nullable: true
        grantedAt:
          type: string
          format: date-time

    MySeasonPermissions:
      type: object
      properties:
        canManageSeasonOrganizers:
          type: boolean
        canManageEventOrganizers:
          type: boolean
        isSeasonOrganizer:
          type: boolean
        eventOrganizerFor:
          type: array
          items:
            type: string
            format: uuid
