openapi: 3.0.3
info:
  title: HatCast API — Troupes et saisons (fragment)
  description: >
    Contrat pour la gestion des troupes, adhésions membres et saisons V2 (Postgres, session cookie).
    `GET /troupes` retourne uniquement les troupes où l'utilisateur connecté a une adhésion active.
    `POST /troupes` crée une troupe et place l'utilisateur courant en `TROUPE_ADMIN` actif (bootstrap MIG-0, slug auto).
    Pagination liste : paramètres `page` (0-based) et `size` (défaut côté client 20, max 100 côté API).
    Les mutations exigent le cookie de session et l’en-tête CSRF `X-XSRF-TOKEN` (voir Spring Security).
    Les mutations d'administration de troupe exigent une adhésion active avec le rôle de base `TROUPE_ADMIN`.
    L'auto-adhésion (`POST …/memberships/me`) est autorisée pour les troupes `joinPolicy = OPEN` (rôle `MEMBER`).
    La troupe démo (`isDemo`) inscrit aussi le membre sur la saison active. Les admins plateforme peuvent modifier `joinPolicy` via `PATCH /admin/troupes/{id}`.
  version: 0.1.0

servers:
  - url: https://{apiHost}/v1
    variables:
      apiHost:
        default: localhost:8080

tags:
  - name: Troupes
  - name: Membres
  - name: Saisons
  - name: Organisateurs

paths:
  /troupes:
    get:
      tags: [Troupes]
      summary: Liste des troupes où l'utilisateur est membre actif
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK (tableau vide si aucune adhésion active)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TroupeListItem'
        '401':
          description: Non authentifié

    post:
      tags: [Troupes]
      summary: Créer une troupe (bootstrap MIG-0)
      description: >
        Crée une troupe et une adhésion active `TROUPE_ADMIN` pour l'utilisateur connecté.
        Le slug est dérivé automatiquement du nom (unicité globale, suffixes `-2`, `-3`, …).
        Toute session authentifiée peut créer une troupe (pas de gate super-admin).
        Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTroupeRequest'
      responses:
        '201':
          description: Troupe créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TroupeListItem'
        '400':
          description: Nom vide ou slug impossible
        '401':
          description: Non authentifié
        '409':
          description: Conflit d'unicité slug après plusieurs tentatives

  /admin/troupes/{troupeId}:
    patch:
      tags: [Troupes]
      summary: Modifier la politique d'adhésion d'une troupe (admin plateforme, FR63)
      description: >
        Met à jour `joinPolicy` (`OPEN` ou `INVITE_ONLY`) sans modifier les adhésions existantes.
        Réservé aux emails `hatcast.auth.super-admin-emails`. Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTroupeJoinPolicyRequest'
      responses:
        '200':
          description: Troupe mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TroupeAdminSummary'
        '403':
          description: Non admin plateforme ou CSRF invalide
        '404':
          description: Troupe inconnue

  /troupes/{troupeId}/memberships/me:
    get:
      tags: [Troupes]
      summary: Adhésion de l'utilisateur courant à une troupe
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSummary'
        '404':
          description: Pas membre actif de cette troupe
        '403':
          description: Accès refusé

    post:
      tags: [Troupes]
      summary: Auto-adhésion à une troupe ouverte (`joinPolicy = OPEN`)
      description: >
        Crée ou réactive une adhésion `MEMBER` pour l'utilisateur connecté lorsque la troupe a `joinPolicy = OPEN`.
        Si `isDemo = true` et une saison active existe, le membre est aussi inscrit comme participant de saison actif.
        Idempotent : une seconde invocation réactive ou retourne l'adhésion existante.
        Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Adhésion créée ou déjà active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSummary'
        '404':
          description: Troupe inconnue
        '403':
          description: Troupe `INVITE_ONLY`, ou CSRF/session invalide

    patch:
      tags: [Troupes]
      summary: Mettre à jour le pseudo affiché de l'utilisateur courant dans la troupe
      description: >
        Self-service : seul `displayName` peut être modifié (pas le rôle ni le statut).
        Trim côté serveur ; pseudo non vide après trim ; max 255 caractères.
        Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyMembershipRequest'
      responses:
        '200':
          description: Adhésion mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSummary'
        '400':
          description: Pseudo vide ou trop long
        '403':
          description: Utilisateur non membre actif de la troupe
        '404':
          description: Troupe inconnue

  /troupes/{troupeId}/memberships/me/preferred-roles:
    get:
      tags: [Troupes]
      summary: Rôles préférés de l'utilisateur courant dans la troupe (FR46)
      description: >
        Retourne les clés de rôles événement pré-cochés pour la saisie de disponibilité (Story 5.2).
        Si jamais enregistré (colonne vide), retourne tous les rôles valides (parité V1).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferredRolesResponse'
        '403':
          description: Utilisateur non membre actif de la troupe
        '401':
          description: Non authentifié

    put:
      tags: [Troupes]
      summary: Remplacer les rôles préférés de l'utilisateur courant dans la troupe
      description: >
        Remplace l'ensemble des rôles préférés (idempotent). Le rôle `volunteer` est toujours inclus.
        Clés valides : celles de `RoleKeys.ALL` côté serveur. Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferredRolesRequest'
      responses:
        '200':
          description: Préférences enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferredRolesResponse'
        '400':
          description: Clé de rôle invalide
        '403':
          description: Utilisateur non membre actif ou CSRF/session invalide
        '401':
          description: Non authentifié

  /troupes/{troupeId}/members:
    get:
      tags: [Membres]
      summary: Liste paginée des membres d’une troupe
      description: Réservé aux administrateur·ices de troupe (`TROUPE_ADMIN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTroupeMembers'
        '400':
          description: Paramètres de pagination invalides
        '403':
          description: Utilisateur non administrateur de troupe

    post:
      tags: [Membres]
      summary: Ajouter ou réactiver un membre existant
      description: >
        Résout l'utilisateur par email normalisé (`trim().lowercase()`). L'utilisateur doit
        s'être connecté au moins une fois. Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTroupeMemberRequest'
            examples:
              member:
                value:
                  email: membre@example.com
                  displayName: Patrice
                  baselineRole: MEMBER
      responses:
        '200':
          description: Membre créé, réactivé ou déjà présent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TroupeMemberAdmin'
        '400':
          description: Validation invalide
        '403':
          description: Utilisateur non administrateur de troupe ou CSRF/session invalide
        '404':
          description: Utilisateur ou troupe introuvable

  /troupes/{troupeId}/members/{membershipId}:
    patch:
      tags: [Membres]
      summary: Modifier le profil membre, statut ou rôle de base
      description: >
        PATCH partiel : omettre une clé pour ne pas la modifier. Refuse toute mutation qui
        laisserait la troupe sans administrateur actif. Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTroupeMemberRequest'
      responses:
        '200':
          description: Membre mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TroupeMemberAdmin'
        '400':
          description: Validation invalide
        '403':
          description: Utilisateur non administrateur de troupe ou CSRF/session invalide
        '404':
          description: Adhésion introuvable dans cette troupe
        '409':
          description: Mutation refusée car elle retirerait le dernier administrateur actif

    delete:
      tags: [Membres]
      summary: Désactiver un membre
      description: >
        Soft delete : définit `status = INACTIVE`; ne supprime pas la ligne. Refuse de
        désactiver le dernier `TROUPE_ADMIN` actif. Requiert CSRF (`X-XSRF-TOKEN`).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Membre désactivé ou déjà inactif
        '403':
          description: Utilisateur non administrateur de troupe ou CSRF/session invalide
        '404':
          description: Adhésion introuvable dans cette troupe
        '409':
          description: Mutation refusée car elle retirerait le dernier administrateur actif

  /troupes/{troupeId}/members/export:
    get:
      tags: [Membres]
      summary: Exporter les membres actifs en CSV
      description: >
        Retourne un fichier CSV UTF-8 (membres actifs uniquement) avec les colonnes
        `email`, `displayName`, `baselineRole`, `status`. Réservé aux administrateur·ices
        de troupe (`TROUPE_ADMIN`). Contrat détaillé : story 2.3 Member CSV contract v1.
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fichier CSV
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          description: Utilisateur non administrateur de troupe

  /troupes/{troupeId}/members/import:
    post:
      tags: [Membres]
      summary: Importer des membres depuis un CSV
      description: >
        Parse et valide le CSV avant persistance ligne par ligne. Les lignes invalides ne
        sont pas persistées ; chaque ligne produit un résultat `SUCCESS`, `SKIPPED` ou
        `ERROR` avec un code stable. Chaque email doit exister dans `users` (import CSV
        utilisateurs ou connexion préalable). Requiert CSRF (`X-XSRF-TOKEN`) et
        `multipart/form-data` avec le champ `file`.
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Résultat d'import ligne par ligne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportResult'
              examples:
                mixed:
                  value:
                    summary:
                      success: 2
                      skipped: 1
                      error: 1
                    rows:
                      - rowNumber: 2
                        outcome: SUCCESS
                        email: alice@example.com
                        code: null
                        message: null
                      - rowNumber: 3
                        outcome: SKIPPED
                        email: bob@example.com
                        code: null
                        message: Aucune modification nécessaire.
                      - rowNumber: 4
                        outcome: ERROR
                        email: unknown@example.com
                        code: USER_NOT_FOUND
                        message: Importez d'abord cet utilisateur via le CSV utilisateurs.
        '400':
          description: Fichier vide, en-tête invalide ou trop de lignes
        '403':
          description: Utilisateur non administrateur de troupe ou CSRF/session invalide
        '404':
          description: Troupe inconnue

  /troupes/{troupeId}/users/import:
    post:
      tags: [Membres]
      summary: Importer des utilisateurs depuis un CSV (migration)
      description: >
        Crée des comptes applicatifs `users` (email + nom affiché) en attente de première
        connexion V2 (`activated_at` null). À exécuter avant l'import CSV membres.
        Requiert CSRF (`X-XSRF-TOKEN`) et `multipart/form-data` avec le champ `file`.
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Résultat d'import ligne par ligne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserImportResult'
        '400':
          description: Fichier vide, en-tête invalide ou trop de lignes
        '403':
          description: Utilisateur non administrateur de troupe ou CSRF/session invalide
        '404':
          description: Troupe inconnue

  /troupes/{troupeId}/seasons:
    get:
      tags: [Saisons]
      summary: Liste paginée des saisons d’une troupe
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSeasons'
        '403':
          description: Utilisateur non membre actif de la troupe

    post:
      tags: [Saisons]
      summary: Créer une saison
      description: >
        Le champ `slug` n’est pas fourni par le client : il est dérivé du titre (normalisation Unicode,
        minuscules, tirets) puis rendu unique dans la troupe (`slug`, `slug-2`, `slug-3`, … si besoin).
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeasonRequest'
      responses:
        '200':
          description: Saison créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          description: Validation (titre vide ou ne permettant pas de générer un slug)

  /troupes/{troupeId}/seasons/by-slug/{slug}:
    get:
      tags: [Saisons]
      summary: Détail d’une saison par slug (navigation `/saison/:slug`)
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '404':
          description: Saison inconnue
        '403':
          description: Utilisateur non membre actif de la troupe

  /seasons/{seasonId}/member-profile/{userId}:
    get:
      tags: [Saisons]
      summary: Résumé profil membre pour une saison (UX-DR8)
      description: >
        Identité troupe-scopée, stats/chart vides tant que les disponibilités/compositions n'existent pas.
        `preferredRoleKeys` présent uniquement lorsque le sujet est l'utilisateur courant.
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberProfileSummary'
        '403':
          description: Utilisateur non membre actif de la troupe de la saison
        '404':
          description: Saison ou membre cible introuvable
        '401':
          description: Non authentifié

  /seasons/{seasonId}/statistics:
    get:
      tags: [Saisons]
      summary: Statistiques de participation (grille story 3.6)
      description: >
        Agrégats sélections / dispos / désistements par participant, colonnes rôles et mois.
        Événements non archivés de la saison ; filtres optionnels `participantId` et `eventId`.
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: query
          schema:
            type: string
            format: uuid
        - name: eventId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonStatisticsResponse'
        '401':
          description: Non authentifié
        '403':
          description: Utilisateur non membre actif de la troupe
        '404':
          description: Saison inconnue

  /seasons/{seasonId}:
    get:
      tags: [Saisons]
      summary: Détail d’une saison
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '403':
          description: Utilisateur non membre actif de la troupe de la saison
        '404':
          description: Saison inconnue

    patch:
      tags: [Saisons]
      summary: Mettre à jour une saison
      description: >
        Mise à jour partielle : une propriété **absente** du corps n’est pas modifiée.
        Une propriété **présente avec la valeur JSON `null`** efface les champs optionnels
        (`description`, `startDate`, `endDate`). Le titre ne peut pas être effacé : `title: null`
        est rejeté (400). Si le titre change, le `slug` est régénéré à partir du nouveau titre
        avec la même règle d’unicité qu’à la création (en excluant la saison courante du test de collision).
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSeasonRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

    delete:
      tags: [Saisons]
      summary: Supprimer définitivement une saison
      description: >
        Suppression irréversible : la ligne `seasons` est effacée et les données dépendantes
        sont supprimées via `ON DELETE CASCADE` (événements, disponibilités, participants, organisateurs).
        Réservé aux administrateurs de troupe ou aux administrateurs plateforme (email configuré).
        Requiert CSRF (`X-XSRF-TOKEN`). Un second appel sur la même saison retourne **404**.
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Saison supprimée (corps vide)
        '403':
          description: Utilisateur non autorisé (membre sans rôle admin troupe)
        '404':
          description: Saison inconnue (y compris après suppression — idempotent côté état)
        '401':
          description: Non authentifié

  /seasons/{seasonId}/actions/archive:
    post:
      tags: [Saisons]
      summary: Archiver une saison (inactive)
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

  /seasons/{seasonId}/actions/activate:
    post:
      tags: [Saisons]
      summary: Activer une saison (désactive les autres actives de la même troupe)
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

  /seasons/{seasonId}/organizers:
    get:
      tags: [Organisateurs]
      summary: Lister les organisateur·ices de saison
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organizer'
        '403':
          description: Accès refusé
    post:
      tags: [Organisateurs]
      summary: Ajouter un·e organisateur·ice de saison
      description: Email normalisé (trim + lowercase) ; ajout idempotent.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerAssignmentRequest'
      responses:
        '200':
          description: Organisateur·ice ajouté·e ou déjà présent·e
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizer'
        '403':
          description: Accès refusé
        '404':
          description: Utilisateur introuvable pour cet email

  /seasons/{seasonId}/organizers/{userId}:
    delete:
      tags: [Organisateurs]
      summary: Retirer un·e organisateur·ice de saison
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Retiré ou déjà absent
        '403':
          description: Accès refusé

  /seasons/{seasonId}/permissions/me:
    get:
      tags: [Organisateurs]
      summary: Permissions organisateur de l’utilisateur courant sur une saison
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySeasonPermissions'
        '403':
          description: Utilisateur non membre actif de la troupe de la saison
        '404':
          description: Saison inconnue

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: HATCAST_SESSION

  parameters:
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    TroupeListItem:
      type: object
      required: [id, name, slug, joinPolicy, isDemo, membership]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        joinPolicy:
          $ref: '#/components/schemas/TroupeJoinPolicy'
        isDemo:
          type: boolean
          description: >
            Identifie la troupe sandbox d'onboarding production (ADR-0015). La seed dev
            Les Improbots reste `false`.
        membership:
          $ref: '#/components/schemas/MembershipSummary'

    TroupeJoinPolicy:
      type: string
      enum: [OPEN, INVITE_ONLY]
      description: >
        Politique d'adhésion à la troupe (FR62). `OPEN` autorise l'auto-adhésion ;
        `INVITE_ONLY` restreint l'accès aux invitations admin.

    UpdateTroupeJoinPolicyRequest:
      type: object
      required: [joinPolicy]
      properties:
        joinPolicy:
          $ref: '#/components/schemas/TroupeJoinPolicy'

    TroupeAdminSummary:
      type: object
      required: [id, name, slug, joinPolicy, isDemo]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        joinPolicy:
          $ref: '#/components/schemas/TroupeJoinPolicy'
        isDemo:
          type: boolean

    MembershipSummary:
      type: object
      required: [id, displayName, status, baselineRole, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/TroupeMembershipStatus'
        baselineRole:
          $ref: '#/components/schemas/TroupeBaselineRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TroupeMembershipStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    TroupeBaselineRole:
      type: string
      enum: [MEMBER, TROUPE_ADMIN]
      description: >
        `MEMBER` donne l'accès membre actif. `TROUPE_ADMIN` autorise l'administration
        des membres, saisons, événements et délégations d'organisateurs.

    TroupeMemberAdmin:
      type: object
      required: [id, userId, displayName, status, baselineRole, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: Photo de profil compte (same-origin GET /users/{userId}/avatar).
        status:
          $ref: '#/components/schemas/TroupeMembershipStatus'
        baselineRole:
          $ref: '#/components/schemas/TroupeBaselineRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedTroupeMembers:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TroupeMemberAdmin'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    MemberImportSummary:
      type: object
      required: [success, skipped, error]
      properties:
        success:
          type: integer
        skipped:
          type: integer
        error:
          type: integer

    MemberImportRowOutcome:
      type: string
      enum: [SUCCESS, SKIPPED, ERROR]

    MemberImportErrorCode:
      type: string
      enum:
        - INVALID_EMAIL
        - USER_NOT_FOUND
        - INVALID_BASELINE_ROLE
        - INVALID_STATUS
        - LAST_ADMIN_VIOLATION
        - PARSE_ERROR

    MemberImportRowResult:
      type: object
      required: [rowNumber, outcome]
      properties:
        rowNumber:
          type: integer
          minimum: 1
        outcome:
          $ref: '#/components/schemas/MemberImportRowOutcome'
        email:
          type: string
          nullable: true
        code:
          allOf:
            - $ref: '#/components/schemas/MemberImportErrorCode'
          nullable: true
        message:
          type: string
          nullable: true

    MemberImportResult:
      type: object
      required: [summary, rows]
      properties:
        summary:
          $ref: '#/components/schemas/MemberImportSummary'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MemberImportRowResult'

    UserImportRowOutcome:
      type: string
      enum: [SUCCESS, SKIPPED, ERROR]

    UserImportErrorCode:
      type: string
      enum:
        - INVALID_EMAIL
        - PARSE_ERROR

    UserImportRowResult:
      type: object
      required: [rowNumber, outcome]
      properties:
        rowNumber:
          type: integer
          minimum: 1
        outcome:
          $ref: '#/components/schemas/UserImportRowOutcome'
        email:
          type: string
          nullable: true
        code:
          allOf:
            - $ref: '#/components/schemas/UserImportErrorCode'
          nullable: true
        message:
          type: string
          nullable: true

    UserImportResult:
      type: object
      required: [summary, rows]
      properties:
        summary:
          $ref: '#/components/schemas/MemberImportSummary'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UserImportRowResult'

    CreateTroupeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nom affiché de la troupe (trim côté serveur ; slug calculé automatiquement).

    AddTroupeMemberRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email utilisateur ; trim + lowercase côté serveur.
        displayName:
          type: string
          maxLength: 255
        baselineRole:
          $ref: '#/components/schemas/TroupeBaselineRole'

    UpdateMyMembershipRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 255
          description: Pseudo affiché dans la troupe ; trim côté serveur.

    PreferredRolesResponse:
      type: object
      required: [preferredRoleKeys]
      properties:
        preferredRoleKeys:
          type: array
          items:
            type: string
          description: Clés de rôles événement (RoleKeys.ALL). `volunteer` toujours présent après enregistrement.

    UpdatePreferredRolesRequest:
      type: object
      required: [preferredRoleKeys]
      properties:
        preferredRoleKeys:
          type: array
          items:
            type: string

    MemberProfileStat:
      type: object
      properties:
        count:
          type: integer
        percent:
          type: integer
        tooltip:
          type: string
          nullable: true

    MemberProfileStats:
      type: object
      properties:
        availabilities:
          $ref: '#/components/schemas/MemberProfileStat'
        selections:
          $ref: '#/components/schemas/MemberProfileStat'
        declines:
          $ref: '#/components/schemas/MemberProfileStat'

    MemberProfileChartBlock:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - available
            - selected
            - pending
            - declined
            - unavailable
            - neutral
        eventTitle:
          type: string
        eventDate:
          type: string
          description: Local calendar date (yyyy-MM-dd)
        roleKey:
          type: string
          nullable: true

    MemberProfileMonth:
      type: object
      properties:
        monthKey:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/MemberProfileChartBlock'

    FavoriteRoleCount:
      type: object
      properties:
        roleKey:
          type: string
        count:
          type: integer

    MemberProfileSummary:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        isSelf:
          type: boolean
        stats:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MemberProfileStats'
        monthlyChart:
          type: array
          items:
            $ref: '#/components/schemas/MemberProfileMonth'
        favoriteRoleCounts:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteRoleCount'
        preferredRoleKeys:
          type: array
          items:
            type: string
          nullable: true
          description: Présent uniquement si isSelf

    UpdateTroupeMemberRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/TroupeMembershipStatus'
        baselineRole:
          $ref: '#/components/schemas/TroupeBaselineRole'

    Season:
      type: object
      properties:
        id:
          type: string
          format: uuid
        troupeId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        archived:
          type: boolean
        active:
          type: boolean
        eventCount:
          type: integer
        participantCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedSeasons:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Season'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    CreateSeasonRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    UpdateSeasonRequest:
      type: object
      description: >
        Champs optionnels : omettre une clé pour ne pas la modifier ; inclure la clé avec `null`
        pour effacer `description`, `startDate` ou `endDate`. Pour `title`, `null` n’est pas autorisé.
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true

    OrganizerAssignmentRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email utilisateur ; trim + lowercase côté serveur.

    Organizer:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
          nullable: true
        grantedAt:
          type: string
          format: date-time

    StatCounts:
      type: object
      required: [selections, dispos, declines]
      properties:
        selections:
          type: integer
          minimum: 0
        dispos:
          type: integer
          minimum: 0
        declines:
          type: integer
          minimum: 0

    StatisticsParticipant:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    StatisticsEvent:
      type: object
      required: [id, title, startsAt, templateType, monthKey]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        templateType:
          type: string
        equityTag:
          type: string
          nullable: true
        monthKey:
          type: string
          description: yyyy-MM (Europe/Paris)

    ParticipantStatisticsRow:
      type: object
      required: [participantId, displayName, annual, monthSummary, byMonth, eventCells]
      properties:
        participantId:
          type: string
          format: uuid
        displayName:
          type: string
        userSlug:
          type: string
          nullable: true
          description: Account slug for member season glance navigation (Story 16.2).
        avatarUrl:
          type: string
          nullable: true
          description: Public avatar URL when participant is linked to a user account.
        annual:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StatCounts'
        monthSummary:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StatCounts'
        byMonth:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/StatCounts'
        eventCells:
          type: object
          additionalProperties:
            type: string

    SeasonStatisticsResponse:
      type: object
      required: [participants, monthKeys, events, rows]
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsParticipant'
        monthKeys:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsEvent'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantStatisticsRow'

    MySeasonPermissions:
      type: object
      properties:
        canManageSeasonOrganizers:
          type: boolean
        canManageEventOrganizers:
          type: boolean
        canManageMembers:
          type: boolean
        canManageSeasons:
          type: boolean
        canManageEvents:
          type: boolean
        isTroupeAdmin:
          type: boolean
        isSeasonOrganizer:
          type: boolean
        eventOrganizerFor:
          type: array
          items:
            type: string
            format: uuid
        canManageSeasonParticipants:
          type: boolean
        canManageEventParticipants:
          type: boolean
        eventParticipantAdminFor:
          type: array
          items:
            type: string
            format: uuid
