openapi: 3.0.3
info:
  title: HatCast API — Authentication (fragment)
  description: >
    Contrat minimal pour l’authentification V2 (Google OIDC + Identity Platform).
    Google : [ADR-0008](../../docs/adr/0008-v2-spa-auth-google-session.md) (slice historique).
    Email/mot de passe : [ADR-0010](../../docs/adr/0010-v2-auth-identity-platform.md).
    Réinitialisation du mot de passe (email « mot de passe oublié ») : entièrement gérée par le client
    Identity Platform (`firebase/auth` : envoi du mail et `confirmPasswordReset`) — **aucun** endpoint REST
    HatCast pour accepter un mot de passe en clair sur ce flux.
    Changement d’e-mail et définition / changement de mot de passe depuis Mon compte (connecté) : également
    gérés côté client Identity Platform (`verifyBeforeUpdateEmail`, `sendPasswordResetEmail`, `applyActionCode`)
    — **aucune** mutation directe de l’e-mail ou du mot de passe en base HatCast.
    Ce fichier pourra être fusionné dans un OpenAPI global `/v1` lorsque le reste de l’API sera publié.
  version: 0.1.0

servers:
  - url: https://{apiHost}/v1
    description: Base API versionnée (remplacer apiHost par l’URL Cloud Run ou locale).
    variables:
      apiHost:
        default: api.example.invalid
        description: Hôte de l’API sans chemin (ex. run.app ou localhost avec port).

tags:
  - name: Auth
    description: Établissement et gestion de session (cookie HttpOnly côté navigateur).

paths:
  /auth/google:
    post:
      tags: [Auth]
      summary: Connexion avec Google (ID token OIDC)
      description: >
        Valide le JWT ID token émis par Google, crée ou met à jour l’utilisateur en base,
        établit une session serveur et renvoie un cookie de session (`Set-Cookie`).
        Les messages d’erreur exposés au client ne doivent pas divulguer de détails internes (NFR-S1).
      operationId: signInWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Session établie ; corps minimal utilisateur ; en-tête `Set-Cookie` pour la session.
          headers:
            Set-Cookie:
              description: Cookie de session HttpOnly (nom exact défini à l’implémentation).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Requête invalide (corps manquant ou mal formé).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ID token Google invalide, expiré ou non autorisé pour ce client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte ou domaine non autorisé (politique produit, si applicable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur serveur ; message générique côté client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/idp:
    post:
      tags: [Auth]
      summary: Session après ID token Identity Platform (email/mot de passe, etc.)
      description: >
        Valide un ID token émis pour le projet Google Cloud Identity Platform (issuer typique
        `https://securetoken.google.com/...`), crée ou met à jour l’utilisateur (`idp_uid`), établit une session
        cookie comme `/auth/google`. Même schéma de corps que Google (`idToken`). Retourne 503 si le serveur
        n’a pas initialisé Firebase Admin (`GOOGLE_APPLICATION_CREDENTIALS`).
      operationId: signInWithIdentityPlatformToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Session établie ; même schéma que `/auth/google`.
          headers:
            Set-Cookie:
              description: Cookie de session HttpOnly.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: ID token invalide ou expiré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Vérification Identity Platform non configurée (credentials serveur absents).

  /auth/me:
    get:
      tags: [Auth]
      summary: Utilisateur courant
      description: Retourne le profil minimal si la session cookie est valide.
      operationId: getCurrentUser
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Utilisateur authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Pas de session ou session expirée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Auth]
      summary: Supprimer le compte courant (auto-service)
      description: >
        Suppression définitive du compte HatCast après ré-authentification (ID token Google ou Identity Platform
        frais dans le corps). Anonymise les données personnelles, désactive les adhésions troupe, conserve
        l’historique statistique des saisons. Requiert session + en-tête CSRF `X-XSRF-TOKEN`. Invalide la session
        en cas de succès (204).
      operationId: deleteAccount
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Compte supprimé ; session invalidée.
        '401':
          description: Session invalide ou ré-authentification échouée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Dernier administrateur actif d’une troupe, ou compte déjà supprimé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      description: Invalide la session serveur et supprime ou invalide le cookie de session.
      operationId: logout
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Déconnexion réussie (corps vide ; cookie effacé ou expiré).
        '401':
          description: Déjà non authentifié (idempotent ; peut être traité comme 204 selon politique d’implémentation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me/avatar:
    post:
      tags: [Auth]
      summary: Téléverser ou remplacer la photo de profil
      description: >
        Multipart `file` (JPEG, PNG, WebP, AVIF ; max 2 Mo). Requiert session + en-tête CSRF `X-XSRF-TOKEN`.
      operationId: uploadAvatar
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar enregistré ; `user.avatarUrl` pointe vers `GET /users/{id}/avatar`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Format ou taille invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session requise.
    delete:
      tags: [Auth]
      summary: Supprimer la photo de profil
      operationId: deleteAvatar
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Avatar supprimé ; `user.avatarUrl` absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Session requise.

  /auth/me/avatar/google:
    post:
      tags: [Auth]
      summary: Importer la photo Google du compte
      description: >
        Copie la photo Google (URL validée `*.googleusercontent.com`) dans le stockage HatCast.
        Corps optionnel `{ "pictureUrl": "..." }` ; sinon URL stockée en session lors de la connexion Google.
      operationId: importGoogleAvatar
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAvatarImportRequest'
      responses:
        '200':
          description: Avatar importé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: URL Google invalide ou indisponible.
        '401':
          description: Session requise.

  /users/{userId}/avatar:
    get:
      tags: [Auth]
      summary: Contenu binaire de l’avatar d’un utilisateur
      description: >
        Session requise. Accès si `userId` = utilisateur courant ou membre actif d’une troupe commune.
      operationId: getUserAvatarContent
      security:
        - SessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image (JPEG, PNG ou WebP) ; `Cache-Control: private, max-age=3600`.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
        '401':
          description: Session requise.
        '403':
          description: Pas de troupe commune avec l’utilisateur cible.
        '404':
          description: Avatar absent.

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: HATCAST_SESSION
      description: >
        Nom réservé pour la documentation ; l’implémentation peut utiliser un autre nom
        stable documenté dans les variables d’environnement et la config Spring Security.

  schemas:
    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: >
            JWT ID token : soit OIDC Google (`/auth/google`), soit ID token Identity Platform
            (`/auth/idp`, issuer `securetoken.google.com`).
        rememberMe:
          type: boolean
          default: true
          description: >
            Si `true` (défaut, alignée case « Se souvenir de moi » cochée en V1), la session serveur
            accepte une inactivité prolongée (ex. 30 jours). Si `false`, session courte (navigateur /
            expiration rapide). Champ omis ⇒ `true`.

    AccountDeletionRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: >
            ID token frais prouvant le contrôle du compte : Google OIDC ou Identity Platform
            (`reauthenticateWithCredential` / GIS re-sign-in).

    AuthSessionResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        googlePictureUrl:
          type: string
          nullable: true
          description: >
            Photo Google proposée à l’import (première connexion sans avatar). Absent après import ou refus.
        platformAdmin:
          type: boolean
          description: >
            True si l’email de l’utilisateur courant figure dans `hatcast.auth.super-admin-emails`
            (administrateur plateforme — ops/support).
          default: false

    GoogleAvatarImportRequest:
      type: object
      properties:
        pictureUrl:
          type: string
          nullable: true
          description: URL Google `*.googleusercontent.com` ; omis si stockée en session.

    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        platformAdmin:
          type: boolean
          description: True si administrateur plateforme (email configuré).
          default: false

    UserSummary:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant utilisateur HatCast (PostgreSQL).
        email:
          type: string
          format: email
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          description: >
            Chemin same-origin vers `GET /users/{id}/avatar` (avec paramètre `v` pour invalidation cache).
        hasGoogleAccount:
          type: boolean
          description: True si le compte est lié à Google (`google_sub` non null).

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Code stable pour logs et support (ex. AUTH_INVALID_ID_TOKEN).
          example: AUTH_INVALID_ID_TOKEN
        message:
          type: string
          description: Message sûr pour l’utilisateur (français recommandé pour l’UI).
          example: Connexion impossible. Réessayez.
