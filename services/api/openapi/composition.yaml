openapi: 3.0.3
info:
  title: HatCast API — Composition (fragment)
  description: >
    Lecture de la composition d’un spectacle et publication du brouillon (FR22).
    Les assignations de slots ne sont renvoyées que lorsque le viewer a le droit
    de les voir (brouillon publié, composition validée, ou organisateur).
  version: 0.1.0

servers:
  - url: https://{apiHost}/v1
    variables:
      apiHost:
        default: localhost:8080

tags:
  - name: Composition

paths:
  /seasons/{seasonId}/events/{eventId}/composition:
    get:
      tags: [Composition]
      summary: Lire la composition d’un spectacle
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResponse'
        '401':
          description: Non authentifié
        '403':
          description: Utilisateur non membre actif de la troupe
        '404':
          description: Saison ou événement inconnu

  /seasons/{seasonId}/events/{eventId}/composition/publish:
    post:
      tags: [Composition]
      summary: Publier le brouillon de composition
      description: >
        Rend les assignations visibles aux membres actifs de la troupe (`publishedAt`).
        Idempotent si déjà publié. Requiert `canManageComposition`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé (non organisateur ou non membre)
        '404':
          description: Saison ou événement inconnu
        '409':
          description: Rien à publier (pas de composition ou aucun slot assigné)

  /seasons/{seasonId}/events/{eventId}/composition/validate:
    post:
      tags: [Composition]
      summary: Valider (verrouiller) la composition
      description: >
        Fixe `validatedAt`, rend la composition visible aux membres même sans publication.
        Les slots déjà `confirmed` (y compris via proxy orga en brouillon) conservent leur statut ;
        les autres assignés passent à `pending` et reçoivent `CONFIRMATION_REQUEST` (première
        validation) ou `RECONFIRMATION_REQUEST` (re-validation après déverrouillage).
        Idempotent si déjà validée (sans renvoyer la notification). Requiert `canManageComposition`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé (non organisateur ou non membre)
        '404':
          description: Saison ou événement inconnu
        '409':
          description: Rien à valider (pas de composition ou aucun slot assigné)

  /seasons/{seasonId}/events/{eventId}/composition/unlock:
    post:
      tags: [Composition]
      summary: Déverrouiller la composition validée
      description: >
        Efface `validatedAt`, conserve les assignations et les statuts de participation
        (`confirmed`, `declined`, `pending`) inchangés. Les membres ordinaires ne voient
        plus les slots jusqu'à re-validation. Requiert `canManageComposition`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé (non organisateur ou non membre)
        '404':
          description: Saison ou événement inconnu
        '409':
          description: La composition n'est pas validée

  /seasons/{seasonId}/events/{eventId}/composition/draw:
    post:
      tags: [Composition]
      summary: Tirer au sort la composition (pondéré)
      description: >
        Exécute un tirage pondéré par rôle pour les slots vides ou, en mode `full`,
        refait les rôles déjà complets. Requiert `canManageComposition`.
        Sur composition validée (`validatedAt`), seul le mode `fillEmpty` est autorisé
        lorsqu’il reste au moins un slot requis vide ; `full` renvoie 409.
        Les nouveaux assignés déclenchent `requestConfirmationForAssignees` (cible Epic 8).
        Retourne la composition mise à jour et les étapes pour l’animation client.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrawCompositionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionDrawResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
        '404':
          description: Saison ou événement inconnu
        '409':
          description: >
            Composition validée sans slot vide (`full`), ou aucun slot requis vide (`fillEmpty`)

  /seasons/{seasonId}/events/{eventId}/composition/declines/{declineId}/restore:
    post:
      tags: [Composition]
      summary: Remettre en composition un participant ayant effectué un retrait
      description: >
        Composition validée requise. Assigne le participant du retrait au premier slot vide
        pour le même `roleKey`, supprime la ligne `declines`, met `participationStatus` à
        `pending`, et appelle `requestConfirmationForAssignees` pour ce participant.
        Requiert `canManageComposition`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
        - name: declineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
        '404':
          description: Désistement inconnu
        '409':
          description: Composition non validée ou aucun slot vide pour le rôle

  /seasons/{seasonId}/events/{eventId}/composition/candidates:
    get:
      tags: [Composition]
      summary: Candidats éligibles pour assignation manuelle d’un rôle
      description: >
        Liste ordonnée par chance décroissante pour le picker organisateur.
        Requiert `canManageComposition`. Sur composition validée, autorisé seulement
        si le rôle a au moins un slot requis vide (complément de créneau).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
        - name: roleKey
          in: query
          required: true
          schema:
            type: string
        - name: slotIndex
          in: query
          required: false
          schema:
            type: integer
          description: Index du slot en cours d'édition (exclut son assigné de la liste d'exclusion)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionCandidateListResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
        '404':
          description: Saison ou événement inconnu
        '409':
          description: Composition validée (verrouillée)

  /seasons/{seasonId}/events/{eventId}/composition/chance-breakdown:
    get:
      tags: [Composition]
      summary: Détail explainability d’un candidat pour un rôle
      description: >
        Waterfall `referencePercent` + `adjustments[]` + métadonnées pool (story 19.7).
        Requiert les mêmes droits explainability que les cotes affichées (6.3 / 6.4).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
        - name: roleKey
          in: query
          required: true
          schema:
            type: string
        - name: participantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChanceBreakdown'
        '401':
          description: Non authentifié
        '403':
          description: Explainability non autorisée
        '404':
          description: Candidat ou rôle inconnu

  /seasons/{seasonId}/events/{eventId}/composition/pool-preview:
    get:
      tags: [Composition]
      summary: Aperçu pool pondéré pour un rôle (orga)
      description: >
        Segments pour barre pool statique (mode preview). Requiert `canManageComposition`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
        - name: roleKey
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionPoolPreviewResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
        '404':
          description: Saison ou événement inconnu

  /seasons/{seasonId}/events/{eventId}/composition/slots/{roleKey}/{slotIndex}/participation:
    post:
      tags: [Composition]
      summary: Confirmer, remettre en attente ou décliner une participation (self-service ou proxy organisateur)
      description: >
        Self-service : le participant lié (`viewerParticipantIds`) peut confirmer, se désister
        (depuis `confirmed`) ou décliner (depuis `pending`) sur son propre slot lorsque la
        composition est validée (`validatedAt`).
        Proxy organisateur : un utilisateur avec `canManageComposition` peut confirmer,
        remettre en attente ou enregistrer un retrait pour le compte de tout slot assigné — y compris en
        brouillon orga (`validatedAt` null), sans notification membre jusqu'à validation ou
        re-validation. Un retrait libère le slot et enregistre une trace dans `declines` (acteur =
        utilisateur authentifié, sujet = participant assigné).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
        - name: roleKey
          in: path
          required: true
          schema:
            type: string
        - name: slotIndex
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSlotParticipationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResponse'
        '400':
          description: Statut invalide ou note trop longue
        '401':
          description: Non authentifié
        '403':
          description: L'utilisateur n'est ni le participant assigné ni un organisateur autorisé
        '404':
          description: Saison, événement ou slot inconnu
        '409':
          description: >
            Membre ordinaire en brouillon (`validatedAt` null) — confirmations pas encore ouvertes ;
            ou slot sans assignation

  /seasons/{seasonId}/events/{eventId}/composition/slots/{roleKey}/{slotIndex}:
    put:
      tags: [Composition]
      summary: Assigner ou retirer un participant sur un slot
      description: >
        Assignation manuelle ou réassignation (`participantId`) ou retrait (`participantId` null).
        Requiert `canManageComposition`. Sur composition validée : assignation uniquement
        vers un slot vide (`participantId` non null) ; retrait ou remplacement occupé → 409.
        Déclenche `requestConfirmationForAssignees` pour le nouvel assigné.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
        - name: roleKey
          in: path
          required: true
          schema:
            type: string
        - name: slotIndex
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignSlotRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
        '404':
          description: Saison ou événement inconnu
        '409':
          description: >
            Composition verrouillée, participant non éligible, ou conflit même rôle

  /seasons/{seasonId}/events/{eventId}/share-recipients:
    get:
      tags: [Composition]
      summary: Destinataires pour partage / annonce manuelle
      description: >
        Liste les destinataires selon l'intent (`draw`, `composition`, `event`, `availability_nudge`).
        Emails obfusqués côté serveur. Requiert `canManageComposition`.
        Mapping des logs de livraison (`notified` / `lastNotifiedAt`, statuts SENT/PARTIAL) par intent dialog :
        `draw` → `COMPOSITION_SHARED` ;
        `composition` → `CONFIRMATION_REQUEST`, `RECONFIRMATION_REQUEST` ;
        `event` → `AVAILABILITY_OPENED`, `MANUAL_AVAILABILITY_ANNOUNCE` ;
        `availability_nudge` → `AVAILABILITY_OPENED`, `MANUAL_AVAILABILITY_NUDGE`,
        `MANUAL_AVAILABILITY_ANNOUNCE`, `AVAILABILITY_PENDING_REMINDER`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
        - name: intent
          in: query
          required: true
          schema:
            type: string
            enum: [draw, composition, event, availability_nudge]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRecipientsResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
        '404':
          description: Saison ou événement inconnu
        '409':
          description: Préconditions intent non satisfaites (ex. aucun assigné)

  /seasons/{seasonId}/events/{eventId}/share-recipients/notify:
    post:
      deprecated: true
      tags: [Composition]
      summary: Envoyer les notifications manuelles
      description: >
        **Deprecated for web UI (story 6.23)** — l'application web n'appelle plus cet endpoint ;
        partage manuel via Copier / WhatsApp uniquement. Endpoint conservé pour appels API directs
        ou callers futurs.
        Dispatch `MANUAL_AVAILABILITY_ANNOUNCE` pour `event`, `MANUAL_AVAILABILITY_NUDGE`
        pour `availability_nudge` ; `draw` / `composition` restent stub (notifiedCount=0).
        Requiert `canManageComposition`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareNotifyRequest'
      responses:
        '200':
          description: Accepté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareNotifyResponse'
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
        '404':
          description: Saison ou événement inconnu
        '409':
          description: Préconditions intent non satisfaites

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: HATCAST_SESSION

  parameters:
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CompositionVisibility:
      type: string
      enum: [none, organizerDraft, publishedDraft, validated]

    ConsecutiveShowWarning:
      type: object
      required: [previousEventId, previousEventTitle, previousEventStartsAt]
      description: Non-blocking hint when assignee held the same role on the immediately preceding validated show in the same category compartment (organizer only).
      properties:
        previousEventId:
          type: string
          format: uuid
        previousEventTitle:
          type: string
        previousEventStartsAt:
          type: string
          format: date-time

    MultiRoleOnEventWarning:
      type: object
      required: [otherRoleKeys]
      description: Non-blocking hint when assignee also holds other role(s) on the same event (organizer only; manual stacking allowed).
      properties:
        otherRoleKeys:
          type: array
          items:
            type: string

    CompositionSlot:
      type: object
      required: [roleKey, slotIndex, participationStatus]
      properties:
        roleKey:
          type: string
        slotIndex:
          type: integer
        participantId:
          type: string
          format: uuid
          nullable: true
        participantDisplayName:
          type: string
          nullable: true
        participationStatus:
          type: string
          enum: [pending, confirmed, declined]
        chancePercent:
          type: integer
          nullable: true
        pastSelectionCount:
          type: integer
          nullable: true
        consecutiveShowWarning:
          allOf:
            - $ref: '#/components/schemas/ConsecutiveShowWarning'
          nullable: true
        multiRoleOnEventWarning:
          allOf:
            - $ref: '#/components/schemas/MultiRoleOnEventWarning'
          nullable: true

    DrawCompositionRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [full, fillEmpty]
          default: full

    CompositionDrawStepCandidate:
      type: object
      required: [participantId, displayName, chancePercent, weight]
      properties:
        participantId:
          type: string
          format: uuid
        displayName:
          type: string
        chancePercent:
          type: integer
        weight:
          type: number
          format: double

    CompositionDrawStep:
      type: object
      required: [roleKey, slotIndex, candidates, totalWeight]
      properties:
        roleKey:
          type: string
        slotIndex:
          type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CompositionDrawStepCandidate'
        selectedParticipantId:
          type: string
          format: uuid
          nullable: true
        randomValue:
          type: number
          format: double
          nullable: true
        totalWeight:
          type: number
          format: double

    CompositionDrawResponse:
      type: object
      required: [composition, steps]
      properties:
        composition:
          $ref: '#/components/schemas/CompositionResponse'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CompositionDrawStep'

    AssignSlotRequest:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
          nullable: true

    CompositionCandidate:
      type: object
      required: [participantId, displayName, chancePercent, pastSelectionCount]
      properties:
        participantId:
          type: string
          format: uuid
        displayName:
          type: string
        chancePercent:
          type: integer
        pastSelectionCount:
          type: integer
        alreadyAssignedRoleKeys:
          type: array
          items:
            type: string
          nullable: true

    CompositionCandidateListResponse:
      type: object
      required: [roleKey, requiredCount, candidates]
      properties:
        roleKey:
          type: string
        requiredCount:
          type: integer
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CompositionCandidate'

    CompositionDecline:
      type: object
      required: [id, participantId, participantDisplayName, roleKey, slotIndex, declinedAt]
      properties:
        id:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        participantDisplayName:
          type: string
        roleKey:
          type: string
        slotIndex:
          type: integer
        declinedAt:
          type: string
          format: date-time
        note:
          type: string
          nullable: true

    UpdateSlotParticipationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, pending, declined]
        note:
          type: string
          nullable: true
          maxLength: 500

    ShareRecipientChannels:
      type: object
      required: [email, push]
      properties:
        email:
          $ref: '#/components/schemas/ShareRecipientChannelStatus'
        push:
          $ref: '#/components/schemas/ShareRecipientChannelStatus'

    ShareRecipientChannelStatus:
      type: object
      required: [eligible, notified]
      properties:
        eligible:
          type: boolean
        notified:
          type: boolean
        lastNotifiedAt:
          type: string
          format: date-time
          nullable: true

    ShareRecipient:
      type: object
      required: [participantId, displayName, channels]
      properties:
        participantId:
          type: string
          format: uuid
        displayName:
          type: string
        emailObfuscated:
          type: string
          nullable: true
        channels:
          $ref: '#/components/schemas/ShareRecipientChannels'

    ShareRecipientsResponse:
      type: object
      required: [total, notifiableCount, manualCount, recipients]
      properties:
        total:
          type: integer
        notifiableCount:
          type: integer
        manualCount:
          type: integer
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/ShareRecipient'
        lastManualNotifyAt:
          type: string
          format: date-time
          nullable: true
        guardDays:
          type: integer
          nullable: true

    ShareNotifyRequest:
      type: object
      required: [intent, messageText]
      properties:
        intent:
          type: string
          enum: [draw, composition, event, availability_nudge]
        messageText:
          type: string
          maxLength: 500

    ShareNotifyResponse:
      type: object
      required: [accepted, notifiedCount, manualCount, intent]
      properties:
        accepted:
          type: boolean
        notifiedCount:
          type: integer
        manualCount:
          type: integer
        intent:
          type: string

    ChanceAdjustment:
      type: object
      required: [factorId, label, deltaPoints]
      properties:
        factorId:
          type: string
        label:
          type: string
        deltaPoints:
          type: integer

    ChanceBreakdownPeer:
      type: object
      required: [participantId, displayName, chancePercent]
      properties:
        participantId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        chancePercent:
          type: integer

    ChanceBreakdown:
      type: object
      required:
        - participantId
        - roleKey
        - displayName
        - chancePercent
        - referencePercent
        - candidateCount
        - poolRank
        - aheadCount
        - tiedAtChanceCount
        - adjustments
      properties:
        participantId:
          type: string
          format: uuid
        roleKey:
          type: string
        displayName:
          type: string
        chancePercent:
          type: integer
        referencePercent:
          type: integer
        candidateCount:
          type: integer
        poolRank:
          type: integer
        aheadCount:
          type: integer
        tiedAtChanceCount:
          type: integer
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/ChanceAdjustment'
        requiredCount:
          type: integer
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        gender:
          type: string
        pool:
          type: object
          properties:
            peers:
              type: array
              items:
                $ref: '#/components/schemas/ChanceBreakdownPeer'
        factorBreakdown:
          type: array
          items:
            type: object
            properties:
              factorId:
                type: string
              multiplier:
                type: number
              label:
                type: string

    CompositionPoolPreviewSegment:
      type: object
      required: [participantId, displayName, chancePercent, weight]
      properties:
        participantId:
          type: string
          format: uuid
        displayName:
          type: string
        chancePercent:
          type: integer
        weight:
          type: number
        avatarUrl:
          type: string
          nullable: true
        gender:
          type: string

    CompositionPoolPreviewResponse:
      type: object
      required: [roleKey, requiredCount, segments]
      properties:
        roleKey:
          type: string
        requiredCount:
          type: integer
        segments:
          type: array
          items:
            $ref: '#/components/schemas/CompositionPoolPreviewSegment'

    CompositionResponse:
      type: object
      required: [visibility, slots]
      properties:
        publishedAt:
          type: string
          format: date-time
          nullable: true
        validatedAt:
          type: string
          format: date-time
          nullable: true
        visibility:
          $ref: '#/components/schemas/CompositionVisibility'
        slots:
          type: array
          items:
