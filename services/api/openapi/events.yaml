openapi: 3.0.3
info:
  title: HatCast API — Événements / spectacles (fragment)
  description: >
    CRUD spectacles par saison. Liste paginée avec `scope=all` (tous, tri par `startsAt` asc),
    `scope=upcoming` (non archivés, `startsAt` ≥ début du jour civil Europe/Paris),
    ou `scope=past` (non archivés, `startsAt` &lt; début du jour civil Paris, tri desc).
    Mutations : CSRF + cookie de session.
  version: 0.1.0

servers:
  - url: https://{apiHost}/v1
    variables:
      apiHost:
        default: localhost:8080

tags:
  - name: Événements
  - name: Organisateurs

paths:
  /seasons/{seasonId}/events:
    get:
      tags: [Événements]
      summary: Liste paginée des spectacles d’une saison
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: scope
          in: query
          description: upcoming = non archivés et à partir d’aujourd’hui ; past = passés (Paris)
          schema:
            type: string
            enum: [all, upcoming, past]
            default: all
        - name: participantId
          in: query
          description: Optionnel — statut dispo du participant saison sur chaque spectacle (Historique)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEvents'
        '400':
          description: Paramètres invalides (page/size/scope)
        '401':
          description: Non authentifié
        '403':
          description: Utilisateur non membre actif de la troupe de la saison
    post:
      tags: [Événements]
      summary: Créer un spectacle
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Validation (titre/date)
        '401':
          description: Non authentifié
        '403':
          description: Gestion refusée (hors règle provisoire seed/admin)

  /seasons/{seasonId}/events/by-slug/{slug}:
    get:
      tags: [Événements]
      summary: Détail d’un spectacle par identifiant URL (slug)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Non authentifié
        '403':
          description: Utilisateur non membre actif de la troupe de la saison
        '404':
          description: Spectacle ou saison introuvable

  /seasons/{seasonId}/events/{eventId}:
    get:
      tags: [Événements]
      summary: Détail d’un spectacle (cycle de vie composition inclus)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Non authentifié
        '403':
          description: Utilisateur non membre actif de la troupe de la saison
        '404':
          description: Spectacle ou saison introuvable
    patch:
      tags: [Événements]
      summary: Mettre à jour un spectacle
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Validation (titre/date)
        '401':
          description: Non authentifié
        '403':
          description: Gestion refusée (hors règle provisoire seed/admin)
        '404':
          description: Événement ou saison inconnue

  /seasons/{seasonId}/events/{eventId}/actions/archive:
    post:
      tags: [Événements]
      summary: Archiver un spectacle
      security:
        - cookieAuth: []
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Non authentifié
        '403':
          description: Gestion refusée (hors règle provisoire seed/admin)
        '404':
          description: Événement ou saison inconnue

  /seasons/{seasonId}/events/{eventId}/organizers:
    get:
      tags: [Organisateurs]
      summary: Lister les organisateur·ices d’un spectacle
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organizer'
        '403':
          description: Accès refusé
    post:
      tags: [Organisateurs]
      summary: Ajouter un·e organisateur·ice d’un spectacle
      description: Réservé aux admins de saison (règle provisoire seed jusqu’à epic-2) ; ajout idempotent.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerAssignmentRequest'
      responses:
        '200':
          description: Organisateur·ice ajouté·e ou déjà présent·e
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizer'
        '403':
          description: Accès refusé
        '404':
          description: Événement ou utilisateur introuvable

  /seasons/{seasonId}/events/{eventId}/organizers/{userId}:
    delete:
      tags: [Organisateurs]
      summary: Retirer un·e organisateur·ice d’un spectacle
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/EventId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Retiré ou déjà absent
        '403':
          description: Accès refusé

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: HATCAST_SESSION

  parameters:
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        seasonId:
          type: string
          format: uuid
        slug:
          type: string
          maxLength: 128
          description: Identifiant URL unique dans la saison
        category:
          type: string
          nullable: true
          maxLength: 64
          description: Compartiment d'équité (null = principal)
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        archived:
          type: boolean
        templateType:
          type: string
          enum: [cabaret, longform, freeform, match, catch, deplacement, survey, custom]
          description: Format du spectacle (cabaret, match, …)
        roleSlots:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 20
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        myAvailabilityStatus:
          type: string
          enum: [available, unavailable, unknown]
          description: Présent pour un membre authentifié lors de la liste des spectacles
        participantFocus:
          type: object
          description: Résumé dispo + rôle composition pour le participant ciblé (Historique)
          properties:
            availabilityStatus:
              type: string
              enum: [available, unavailable, unknown]
            compositionRoleKey:
              type: string
              nullable: true
            inTeam:
              type: boolean
            slotParticipationStatus:
              type: string
              nullable: true
              enum: [pending, confirmed, declined]
        compositionLifecycle:
          type: string
          enum: [preparing, draftComposition, awaitingConfirmations, gapsToFill, complete]
          description: Cycle de vie FR28 (membres authentifiés de la troupe)
        teamStatusBadge:
          $ref: '#/components/schemas/TeamStatusBadge'

    TeamStatusBadge:
      type: object
      required: [key, label, tone, shortLabel]
      properties:
        key:
          type: string
          enum: [collecting, preparing, confirmed]
        label:
          type: string
          description: Libellé complet (agenda détail Infos)
        tone:
          type: string
          enum: [collecting, preparing, confirmed]
          description: Modificateur SCSS
        shortLabel:
          type: string
          description: Libellé court pour l’agenda

    CreateEventRequest:
      type: object
      required: [title, startsAt]
      properties:
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        description:
          type: string
        location:
          type: string
        templateType:
          type: string
          enum: [cabaret, longform, freeform, match, catch, deplacement, survey, custom]
          description: Format du spectacle (cabaret, match, …). Défaut serveur cabaret si absent.
        roleSlots:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 20
          description: Défaut = slots du format (`templateType`)
        slug:
          type: string
          maxLength: 128
          description: >
            Identifiant URL optionnel (sinon dérivé du titre). Lettres minuscules, chiffres et tirets.
        category:
          type: string
          maxLength: 64
          description: Tag d'équité optionnel (un seul slug ; absent = principal)

    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        description:
          type: string
        location:
          type: string
        templateType:
          type: string
          enum: [cabaret, longform, freeform, match, catch, deplacement, survey, custom]
          description: Format du spectacle (cabaret, match, …)
        roleSlots:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 20
          description: Remplacement complet si présent (PATCH)
        slug:
          type: string
          maxLength: 128
          description: Nouvel identifiant URL (unicité par saison ; absent = inchangé)
        category:
          type: string
          nullable: true
          maxLength: 64
          description: Tag d'équité (null explicite = compartiment principal ; absent = inchangé)

    PagedEvents:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    OrganizerAssignmentRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email utilisateur ; trim + lowercase côté serveur.

    Organizer:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
          nullable: true
        grantedAt:
          type: string
          format: date-time
