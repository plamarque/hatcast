openapi: 3.0.3
info:
  title: HatCast API — Tags d'équité troupe (fragment)
  description: Glossaire des tags d'équité par troupe (compartiments d'équité ADR 0013).
  version: 0.1.0

servers:
  - url: https://{apiHost}/v1
    variables:
      apiHost:
        default: localhost:8080

tags:
  - name: Tags d'équité

paths:
  /troupes/{troupeId}/equity-tags:
    get:
      tags: [Tags d'équité]
      summary: Liste le glossaire des tags d'équité d'une troupe
      security:
        - cookieAuth: []
      parameters:
        - name: troupeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TroupeEquityTag'
        '401':
          description: Non authentifié
        '403':
          description: Utilisateur non membre actif de la troupe
        '404':
          description: Troupe introuvable

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: HATCAST_SESSION

  schemas:
    TroupeEquityTag:
      type: object
      required: [slug, label]
      properties:
        slug:
          type: string
          maxLength: 64
          description: Identifiant canonique (a-z, chiffres, tirets)
        label:
          type: string
          maxLength: 128
          description: Libellé affiché (autocomplete)
