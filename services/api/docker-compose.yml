# Postgres local pour valider Flyway + Spring Session JDBC hors H2 (profil Spring: docker).
# Usage : docker compose -f services/api/docker-compose.yml up -d
# Puis : HATCAST_SPRING_PROFILE=docker ./gradlew bootRun
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: hatcast
      POSTGRES_USER: hatcast
      POSTGRES_PASSWORD: hatcast
    volumes:
      - hatcast-v2-pgdata:/var/lib/postgresql/data

volumes:
  hatcast-v2-pgdata:
