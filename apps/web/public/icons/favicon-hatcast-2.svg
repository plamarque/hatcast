<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon variant: frame-filling mask + GitHub-style detached status badge (white halo + orange disc + white check), optimized for 16/32px sharpness. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 116 364 364" fill="none" role="img" aria-label="HatCast">
  <!-- Comedy mask: same silhouette as the app icon, cropped to fill the frame -->
  <path
    fill="#7A4FD0"
    d="M120 168
       C120 142 144 130 174 134
       C206 138 234 158 256 166
       C278 158 306 138 338 134
       C368 130 392 142 392 168
       C396 252 348 446 256 452
       C164 446 116 252 120 168Z"
  />

  <!-- Bold smiling eyes -->
  <path fill="#FFFFFF" d="M156 222 C182 268 216 268 242 222 C220 236 178 236 156 222Z" />
  <path fill="#FFFFFF" d="M270 222 C296 268 330 268 356 222 C334 236 292 236 270 222Z" />

  <!-- Bold open laughing mouth -->
  <path
    fill="#FFFFFF"
    d="M172 300
       C214 316 298 316 340 300
       C332 372 292 414 256 414
       C220 414 180 372 172 300Z"
  />

  <!-- Detached status badge (GitHub-style): white halo separates it from the mask, orange disc, white check -->
  <circle cx="388" cy="404" r="70" fill="#FFFFFF" />
  <circle cx="388" cy="404" r="56" fill="#FF9800" />
  <path
    d="M360 404 L380 425 L418 382"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
