<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="HatCast">
  <defs>
    <linearGradient id="maskGradient" x1="120" y1="120" x2="392" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A974F0"/>
      <stop offset="55%" stop-color="#7E57C2"/>
      <stop offset="100%" stop-color="#6750A4"/>
    </linearGradient>
  </defs>

  <!-- Comedy mask — wide, gentle concave top (two soft raised corners), tapering to a rounded chin -->
  <path
    fill="url(#maskGradient)"
    d="M120 168
       C120 142 144 130 174 134
       C206 138 234 158 256 166
       C278 158 306 138 338 134
       C368 130 392 142 392 168
       C396 252 348 446 256 452
       C164 446 116 252 120 168Z"
  />

  <!-- Smiling closed eyes (from original logo) — bolder for small-size legibility -->
  <path
    fill="#FFFBFE"
    d="M164 222 C186 258 214 258 236 222 C216 234 184 234 164 222Z"
  />
  <path
    fill="#FFFBFE"
    d="M276 222 C298 258 326 258 348 222 C328 234 296 234 276 222Z"
  />

  <!-- Open laughing mouth (white) -->
  <path
    fill="#FFFBFE"
    d="M180 300
       C216 312 296 312 332 300
       C324 362 290 400 256 400
       C222 400 188 362 180 300Z"
  />

  <!-- Detached status badge (GitHub-style): surface halo separates it from the mask, orange disc, white check -->
  <circle cx="388" cy="404" r="70" fill="#FFFBFE" />
  <circle cx="388" cy="404" r="56" fill="#FF9800" />
  <path
    d="M360 404 L380 425 L418 382"
    fill="none"
    stroke="#FFFBFE"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
