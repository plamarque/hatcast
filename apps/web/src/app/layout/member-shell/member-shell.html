<div class="member-shell" [class.member-shell--with-nav]="showNav()">
  @if (showNav()) {
    <app-member-nav class="member-shell__nav">
      @if (adventVisible()) {
        <button id="advent-entry-desktop" mat-icon-button [class.member-shell__advent-entry--sparkle]="adventSparkle()" class="member-shell__advent-entry member-shell__advent-entry--desktop" type="button" (click)="openAdvent()" aria-label="Ouvrir le quiz de l’Avent" title="Quiz de l’Avent"><img src="/advent/gifts/gift-closed-v1.png" alt=""><span class="member-shell__gift-effect" aria-hidden="true"></span></button>
      }
    </app-member-nav>
  }
  <main class="member-shell__content" tabindex="-1">
    @if (showNav() && adventError()) {
      <div class="member-shell__advent-error" role="alert">Le quiz de l’Avent est momentanément indisponible. <button mat-button type="button" (click)="retryAdvent()">Réessayer</button></div>
    }
    @if (showNav() && isMobileViewport() && adventVisible()) {
      <button id="advent-entry-mobile" mat-icon-button [class.member-shell__advent-entry--sparkle]="adventSparkle()" class="member-shell__advent-entry" type="button" (click)="openAdvent()" aria-label="Ouvrir le quiz de l’Avent" title="Quiz de l’Avent">
        <img src="/advent/gifts/gift-closed-v1.png" alt=""><span class="member-shell__gift-effect" aria-hidden="true"></span>
      </button>
    }
    @if (showNav() && isMobileViewport()) {
      <div class="member-shell__account-trigger">
        <app-member-account-menu-trigger variant="shell-mobile-icon" />
      </div>
    }
    <router-outlet />
  </main>
</div>
