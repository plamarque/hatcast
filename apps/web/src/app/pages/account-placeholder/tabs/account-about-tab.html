<div class="account-page__about-panel" aria-labelledby="account-about-heading">
  <h2 id="account-about-heading" class="account-page__visually-hidden">À propos de HatCast</h2>

  <div class="account-page__about-brand">
    <img
      class="account-page__about-logo"
      src="/icons/logo-hatcast-2.svg"
      alt=""
      width="48"
      height="48"
      aria-hidden="true"
    />
    <div class="account-page__about-brand-text">
      <p class="account-page__about-app-name">HatCast</p>
      <p
        class="account-page__about-version"
        data-testid="account-app-version"
        [attr.aria-describedby]="buildMetaLine() ? 'account-app-build-meta' : null"
      >
        Version {{ version() }}
      </p>
      @if (buildMetaLine(); as metaLine) {
        <p
          id="account-app-build-meta"
          class="account-page__about-build-meta"
          data-testid="account-app-build-meta"
        >
          {{ metaLine }}
        </p>
      }
    </div>
  </div>

  <div class="account-page__about-actions" role="group" aria-label="Actions À propos">
    <button
      type="button"
      class="account-page__about-action"
      data-testid="account-changelog"
      [attr.aria-label]="versionTooltip()"
      (click)="openChangelog()"
    >
      <mat-icon class="account-page__about-action-icon" aria-hidden="true">new_releases</mat-icon>
      <span class="account-page__about-action-text">Nouveautés</span>
      <mat-icon class="account-page__about-action-chevron" aria-hidden="true">chevron_right</mat-icon>
    </button>

    @if (manualCheckAvailable()) {
      <button
        type="button"
        class="account-page__about-action"
        data-testid="account-check-updates"
        [disabled]="checkingUpdates()"
        [attr.aria-label]="
          checkingUpdates()
            ? 'Vérification des mises à jour en cours'
            : 'Vérifier les mises à jour de HatCast'
        "
        (click)="checkForUpdates()"
      >
        @if (checkingUpdates()) {
          <mat-progress-spinner
            class="account-page__about-action-spinner"
            diameter="20"
            mode="indeterminate"
            aria-hidden="true"
          />
        } @else {
          <mat-icon class="account-page__about-action-icon" aria-hidden="true">system_update</mat-icon>
        }
        <span class="account-page__about-action-text">Vérifier les mises à jour</span>
        @if (!checkingUpdates()) {
          <mat-icon class="account-page__about-action-chevron" aria-hidden="true">chevron_right</mat-icon>
        }
      </button>
    }
  </div>

  <p class="account-page__about-copyright" data-testid="account-about-copyright">
    © 2025–2026 Patrice Lamarque
  </p>
</div>
