<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  @if (sent()) {
    <p class="account-security-dialog__message">{{ successMessage() }}</p>
  } @else {
    <p class="account-security-dialog__intro">{{ introCopy }}</p>
    <div class="account-security-dialog__current">
      <span class="account-security-dialog__current-label">E-mail de destination</span>
      <span class="account-security-dialog__current-value">{{ data.accountEmail }}</span>
    </div>
    <p class="account-security-dialog__help">{{ helpCopy }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end" class="account-security-dialog__actions">
  @if (sent()) {
    <button type="button" mat-flat-button color="primary" mat-dialog-close>Fermer</button>
  } @else {
    <button type="button" mat-button mat-dialog-close [disabled]="submitting()">Annuler</button>
    <button
      type="button"
      mat-flat-button
      color="primary"
      [disabled]="submitting()"
      (click)="confirm()"
    >
      @if (submitting()) {
        <mat-spinner diameter="20" />
      } @else {
        Envoyer l’email
      }
    </button>
  }
</mat-dialog-actions>
