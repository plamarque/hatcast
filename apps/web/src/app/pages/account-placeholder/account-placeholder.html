<div class="account-page">
  <header class="account-page__header">
    <div class="account-page__titles">
      <h1 class="account-page__title">Mon compte</h1>
      <p class="account-page__subtitle">Paramètres de votre compte HatCast.</p>
    </div>
  </header>

  @if (loading()) {
    <div class="account-page__spinner" role="status" aria-label="Chargement">
      <mat-spinner diameter="40" />
    </div>
  } @else if (user()) {
    <nav
      mat-tab-nav-bar
      class="account-page__tabs"
      [tabPanel]="accountTabPanel"
      aria-label="Sections Mon compte"
    >
      <a
        mat-tab-link
        routerLink="/compte"
        routerLinkActive
        #identityRla="routerLinkActive"
        [active]="identityRla.isActive"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Identité
      </a>
      <a
        mat-tab-link
        routerLink="/compte/preferences"
        routerLinkActive
        #preferencesRla="routerLinkActive"
        [active]="preferencesRla.isActive"
      >
        Préférences
      </a>
      <a
        mat-tab-link
        routerLink="/compte/notifications"
        routerLinkActive
        #notificationsRla="routerLinkActive"
        [active]="notificationsRla.isActive"
      >
        Notifications
      </a>
      <a
        mat-tab-link
        routerLink="/compte/securite"
        routerLinkActive
        #securityRla="routerLinkActive"
        [active]="securityRla.isActive"
      >
        Sécurité
      </a>
      <a
        mat-tab-link
        routerLink="/compte/a-propos"
        routerLinkActive
        #aboutRla="routerLinkActive"
        [active]="aboutRla.isActive"
      >
        À propos
      </a>
    </nav>
    <mat-tab-nav-panel #accountTabPanel class="account-page__tab-panel" />

    <div class="account-page__tab-content">
      <router-outlet />
    </div>
  }
</div>
