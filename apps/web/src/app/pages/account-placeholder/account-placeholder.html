<mat-card appearance="outlined" class="account-ph">
  <mat-card-header>
    <mat-card-title>Mon compte</mat-card-title>
    <mat-card-subtitle>Paramètres du compte</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p class="account-ph__text">
      La gestion détaillée du compte (e-mail, mot de passe lorsque vous êtes connecté, etc.) arrive
      dans une prochaine livraison.
    </p>
    <a mat-button routerLink="/accueil">Retour à l’accueil</a>
  </mat-card-content>
</mat-card>
