<div class="account-page">
  <header class="account-page__header">
    <div class="account-page__header-topline">
      <h1 class="account-page__title">Mon compte</h1>
      @if (!loading() && user()) {
        <div class="account-page__header-actions">
          <button
            type="button"
            mat-button
            class="account-page__logout"
            data-testid="account-logout"
            aria-label="Se déconnecter"
            (click)="logout()"
          >
            <mat-icon aria-hidden="true">logout</mat-icon>
            <span class="account-page__logout-label">Se déconnecter</span>
          </button>
        </div>
      }
    </div>
    <p class="account-page__subtitle">Paramètres de votre compte HatCast.</p>
  </header>

  @if (loading()) {
    <div class="account-page__spinner" role="status" aria-label="Chargement">
      <mat-spinner diameter="40" />
    </div>
  } @else if (user()) {
    <nav
      mat-tab-nav-bar
      class="account-page__tabs"
      [tabPanel]="accountTabPanel"
      aria-label="Sections Mon compte"
    >
      <a
        mat-tab-link
        routerLink="/compte"
        routerLinkActive
        #profileRla="routerLinkActive"
        [active]="profileRla.isActive"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Mon profil
      </a>
      <a
        mat-tab-link
        routerLink="/compte/preferences"
        routerLinkActive
        #preferencesRla="routerLinkActive"
        [active]="preferencesRla.isActive"
      >
        Préférences
      </a>
      <a
        mat-tab-link
        routerLink="/compte/notifications"
        routerLinkActive
        #notificationsRla="routerLinkActive"
        [active]="notificationsRla.isActive"
      >
        Notifications
      </a>
      <a
        mat-tab-link
        routerLink="/compte/a-propos"
        routerLinkActive
        #aboutRla="routerLinkActive"
        [active]="aboutRla.isActive"
      >
        À propos
      </a>
    </nav>
    <mat-tab-nav-panel #accountTabPanel class="account-page__tab-panel" />

    <div class="account-page__tab-content">
      <router-outlet />
    </div>
  }
</div>
