<section class="profile-chart" data-testid="draw-formula-profile-chart">
  <h3 class="profile-chart__title">Composition de la formule</h3>
  <div class="profile-chart__viz">
    <div class="profile-chart__layout">
      <div
        class="profile-chart__donut"
        role="img"
        [attr.aria-label]="ariaLabel()"
        [style.background]="donutBackground()"
      >
        <div class="profile-chart__donut-hole">
          <span class="profile-chart__donut-line">3 critères</span>
          <span class="profile-chart__donut-line profile-chart__donut-line--emphasis">{{ centerLine() }}</span>
        </div>
      </div>
      <ul class="profile-chart__legend" data-testid="draw-formula-profile-legend">
        @for (segment of segments(); track segment.factorId) {
          <li
            class="profile-chart__legend-item"
            [class.profile-chart__legend-item--off]="!segment.enabled"
          >
            <span
              class="profile-chart__swatch"
              [style.background]="profileChartColor(segment.factorId, segment.enabled)"
              aria-hidden="true"
            ></span>
            <span class="profile-chart__legend-label">
              {{ segment.label }}
            </span>
            <span class="profile-chart__legend-percent">
              @if (segment.enabled) {
                {{ segment.percent }} %
              } @else {
                <span class="profile-chart__legend-off">off</span>
              }
            </span>
          </li>
        }
      </ul>
    </div>
  </div>
  <ng-content />
</section>
