<div class="troupe-hub-stub">
  @if (loading()) {
    <mat-spinner diameter="40" role="status" aria-label="Chargement" />
  } @else if (notFound()) {
    <p class="troupe-hub-stub__status">Troupe introuvable.</p>
    <a routerLink="/agenda">Voir mon agenda</a>
  } @else if (troupeName(); as name) {
    <div class="troupe-hub-stub__hero-row">
      <h1 class="troupe-hub-stub__title">{{ name }}</h1>
      <app-scope-admin-menu scope="troupe" [items]="troupeAdminItems()" />
    </div>
    <p class="troupe-hub-stub__copy">Hub troupe — story 17.4</p>
    <a routerLink="/agenda">Voir mon agenda</a>
  }
</div>
