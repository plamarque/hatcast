<header class="event-detail-header">
  <div class="event-detail-header__left">
    @if (showBreadcrumb()) {
      <app-context-breadcrumb
        layout="event"
        [troupeName]="troupeName()!"
        [troupeSlug]="troupeSlug()!"
        [seasonTitle]="seasonTitle()!"
        [seasonSlug]="seasonSlug()"
        [eventTitle]="eventTitle()"
      />
    }
  </div>
  <div class="event-detail-header__right">
    @if (user(); as u) {
      <app-member-agenda-shortcut />
      <button
        type="button"
        mat-stroked-button
        class="event-detail-header__user"
        [matMenuTriggerFor]="userMenu"
        [attr.aria-label]="'Menu compte : ' + userDisplayLabel()"
      >
        <app-user-avatar
          class="event-detail-header__user-avatar"
          [style.--user-avatar-size.px]="24"
          [displayName]="userDisplayLabel()"
          [avatarUrl]="u.avatarUrl ?? null"
          [size]="24"
          [clickable]="profileContextReady()"
          (avatarClick)="openSelfProfile()"
        />
        <span class="event-detail-header__user-label">{{ userDisplayLabel() }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <app-user-account-menu-items
          [userSlug]="u.slug"
          [glanceTroupeId]="troupeId()"
          [glanceLeagueId]="seasonId()"
          [showLogout]="false"
        />
      </mat-menu>
    }
  </div>
</header>
