<header class="event-detail-header" [class.event-detail-header--with-admin]="showAdminMenu()">
  <div class="event-detail-header__left">
    @if (showBreadcrumb()) {
      <app-context-breadcrumb
        layout="event"
        [troupeId]="troupeId()"
        [troupeName]="troupeName()!"
        [troupeSlug]="troupeSlug()!"
        [troupeIsDemo]="troupeIsDemo()"
        [seasonTitle]="seasonTitle()!"
        [seasonSlug]="seasonSlug()"
        [eventTitle]="eventTitle()"
      />
    }
  </div>
  @if (showAdminMenu()) {
    <div class="event-detail-header__admin">
      <app-scope-admin-menu scope="event" [items]="adminItems()" />
    </div>
  }
</header>
