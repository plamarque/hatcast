<header class="event-detail-header">
  <div class="event-detail-header__left">
    @if (showBreadcrumb()) {
      <app-context-breadcrumb
        layout="event"
        [troupeId]="troupeId()"
        [troupeName]="troupeName()!"
        [troupeSlug]="troupeSlug()!"
        [seasonTitle]="seasonTitle()!"
        [seasonSlug]="seasonSlug()"
        [eventTitle]="eventTitle()"
      />
    }
  </div>
</header>
