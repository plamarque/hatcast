<header class="event-detail-header" [class.event-detail-header--with-admin]="showAdminMenu()">
  @if (showBack()) {
    <button
      type="button"
      mat-icon-button
      class="event-detail-header__back"
      aria-label="Retour"
      (click)="onBack()"
    >
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
    </button>
  }
  <div class="event-detail-header__center">
    <ng-content select="[data-event-detail-title-row]" />
  </div>
  @if (canEdit()) {
    <button type="button" mat-icon-button aria-label="Modifier le spectacle" (click)="edit.emit()">
      <mat-icon aria-hidden="true">edit</mat-icon>
    </button>
  }
  @if (showAdminMenu()) {
    <div class="event-detail-header__admin">
      <app-scope-admin-menu scope="event" [items]="adminItems()" />
    </div>
  }
</header>
