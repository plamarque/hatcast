<nav class="event-context-strip" aria-label="Contexte du spectacle">
  <p class="event-context-strip__line">
    @if (showTroupeLink()) {
      <a
        class="event-context-strip__troupe event-context-strip__link"
        [routerLink]="['/troupe', troupeSlug(), 'admin', 'membres']"
        [attr.aria-label]="'Voir la troupe ' + troupeName()"
      >
        {{ troupeName() }}
      </a>
    } @else {
      <span class="event-context-strip__troupe">{{ troupeName() }}</span>
    }
    <span class="event-context-strip__sep" aria-hidden="true"> · </span>
    <a
      class="event-context-strip__league event-context-strip__link"
      [routerLink]="leagueWorkspacePath(seasonSlug())"
      [attr.aria-label]="'Voir la ligue ' + leagueTitle()"
    >
      {{ leagueTitle() }}
    </a>
  </p>
</nav>
