<div class="event-detail">
  <app-event-detail-header
    [seasonSlug]="slug()"
    [seasonId]="seasonId()"
    [troupeId]="troupeId()"
    [troupeName]="contextTroupeName()"
    [troupeSlug]="contextTroupeSlug()"
    [troupeIsDemo]="contextTroupeIsDemo()"
    [seasonTitle]="contextLeagueTitle()"
    [eventTitle]="event()?.title ?? null"
    [adminItems]="eventAdminItems()"
  />

  @if (loading()) {
    <div class="event-detail__spinner" role="status">
      <mat-spinner diameter="40" />
    </div>
  } @else if (event(); as ev) {
    <div class="event-detail__tabs-shell">
      <mat-tab-group
        class="event-detail__tabs"
        [selectedIndex]="tabIndex()"
        (selectedIndexChange)="onTabChange($event)"
        dynamicHeight
      >
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="event-detail__tab-icon" aria-hidden="true">info</mat-icon>
          Infos
        </ng-template>
        @if (activeTab() === 'infos') {
          <app-event-infos-tab
            [event]="ev"
            [seasonId]="seasonId()"
            [troupeId]="troupeId()"
            [canManageEvents]="canManageEvents()"
            [canManageEventOrganizers]="canManageEventOrganizersFor(ev.id)"
            [canManageComposition]="canManageComposition()"
            [organizersReloadTrigger]="organizersReloadTrigger()"
            (eventUpdated)="onEventInfosUpdated($event)"
          />
        }
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="event-detail__tab-icon" aria-hidden="true">grid_on</mat-icon>
          Dispos
        </ng-template>
        @if (activeTab() === 'dispos') {
          <section class="event-detail__tab-panel">
            <app-event-dispos-tab
              [seasonId]="seasonId()"
              [troupeId]="troupeId()"
              [event]="ev"
              [currentUserId]="user()?.id ?? ''"
              [canSwitchSubject]="canSwitchSubject()"
            />
          </section>
        }
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="event-detail__tab-icon" aria-hidden="true">groups</mat-icon>
          Équipe
        </ng-template>
        @if (activeTab() === 'equipe') {
          <app-event-equipe-tab
            [seasonId]="seasonId()"
            [seasonSlug]="slug()"
            [event]="ev"
            [canManageComposition]="canManageComposition()"
            [showConfirmPending]="showConfirmPending()"
            (compositionPublished)="syncCompositionFromEquipe($event)"
          />
        }
      </mat-tab>
      </mat-tab-group>
    </div>
  }
</div>
