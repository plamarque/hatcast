<div class="season-view-toolbar">
  <div class="season-toolbar">
    <div class="season-toolbar__left">
      @if (showDetailsToggle()) {
        <button
          type="button"
          mat-stroked-button
          class="season-toolbar__export"
          [attr.aria-pressed]="detailsExpanded()"
          aria-label="Masquer ou afficher les détails des colonnes"
          (click)="toggleDetails()"
        >
          <mat-icon>{{ detailsExpanded() ? 'visibility_off' : 'visibility' }}</mat-icon>
          <span>{{ detailsExpanded() ? 'Masquer' : 'Détails' }}</span>
        </button>
      }
    </div>

    <div class="season-toolbar__right">
      <mat-button-toggle-group
        class="season-toolbar__views"
        [value]="seasonView()"
        (change)="seasonView.set($event.value)"
        hideSingleSelectionIndicator
        aria-label="Changer de vue saison"
      >
        <mat-button-toggle value="agenda">Agenda</mat-button-toggle>
        @if (!agendaOnlyGuest()) {
          <mat-button-toggle value="history">Historique</mat-button-toggle>
        }
        @if (!partialGuestWorkspace()) {
          <mat-button-toggle value="stats">Statistiques</mat-button-toggle>
        }
      </mat-button-toggle-group>

      @if (filterTriggerVisible()) {
        <div data-testid="filter-trigger-column">
          <app-filter-trigger
            [visible]="true"
            [activeCount]="activeFilterChips().length"
            [warn]="seasonView() === 'stats' && statsCategoriesNoneSelected()"
            [expanded]="filterPanelOpen()"
            (open)="toggleCriteriaPanel()"
          />
        </div>
      }
    </div>
  </div>

  @if (filterTriggerVisible()) {
    @if (filterPanelOpen()) {
      <div class="season-toolbar__criteria-panel" data-testid="season-toolbar-criteria-panel">
        <app-filter-criteria-bar
          [dimensions]="hubDimensions()"
          [chips]="activeFilterChips()"
          (openDimension)="onOpenFilterDimension($event)"
          (removeDimension)="onRemoveFilterDimension($event)"
          (clearAll)="onClearAllFilters()"
        />
      </div>
    } @else if (activeFilterChips().length > 0) {
      <div class="season-toolbar__chips-row" data-testid="season-toolbar-chips-row">
        <app-active-filter-chips
          [chips]="activeFilterChips()"
          (removeDimension)="onRemoveFilterDimension($event)"
          (openDimension)="onOpenFilterDimension($event)"
          (clearAll)="onClearAllFilters()"
        />
      </div>
    }
  }
</div>
