<header class="season-header">
  <div class="season-header__left">
    <a mat-icon-button routerLink="/seasons" class="season-header__back" aria-label="Retour aux saisons">
      <mat-icon>chevron_left</mat-icon>
    </a>
    <div class="season-header__logo" aria-hidden="true">
      <mat-icon>theater_comedy</mat-icon>
    </div>
    <h1 class="season-header__title">{{ seasonTitle() }}</h1>
  </div>
  <div class="season-header__right">
    @if (canManageSettings()) {
      <button
        mat-icon-button
        type="button"
        matTooltip="Réglages saison"
        aria-label="Réglages saison"
        [matMenuTriggerFor]="settingsMenu"
      >
        <mat-icon>settings</mat-icon>
      </button>
      <mat-menu #settingsMenu="matMenu">
        @if (canManageSeasonParticipants()) {
          <a mat-menu-item [routerLink]="['/saison', seasonSlug(), 'admin', 'participants']">
            <mat-icon>person_add</mat-icon>
            <span>Participants</span>
          </a>
        }
        @if (canManageSeasonOrganizersOnly()) {
          <a
            mat-menu-item
            [routerLink]="['/saison', seasonSlug(), 'admin', 'membres']"
            [queryParams]="{ onglet: 'organisateurs' }"
          >
            <mat-icon>badge</mat-icon>
            <span>Organisateur·ices</span>
          </a>
        }
      </mat-menu>
    }
    @if (user(); as u) {
      <button
        type="button"
        mat-stroked-button
        class="season-header__user"
        [matMenuTriggerFor]="userMenu"
        [attr.aria-label]="'Menu compte : ' + userDisplayLabel()"
      >
        <app-user-avatar
          class="season-header__user-avatar"
          [style.--user-avatar-size.px]="24"
          [displayName]="userDisplayLabel()"
          [avatarUrl]="u.avatarUrl ?? null"
          [size]="24"
          [clickable]="true"
          (avatarClick)="openSelfProfile()"
        />
        <span class="season-header__user-label">{{ userDisplayLabel() }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <a mat-menu-item routerLink="/compte">Mon compte</a>
        <button mat-menu-item type="button" (click)="logout()">Se déconnecter</button>
      </mat-menu>
    }
  </div>
</header>
