<header class="season-header">
  <div class="season-header__left">
    @if (showBreadcrumb()) {
      <app-context-breadcrumb
        layout="season"
        [troupeId]="troupeId()"
        [troupeName]="troupeName()!"
        [troupeSlug]="troupeSlug()!"
        [troupeIsDemo]="troupeIsDemo()"
        [seasonTitle]="seasonTitle()"
        [seasonSlug]="seasonSlug()"
      />
    }
  </div>
</header>
