<header class="season-header">
  <div class="season-header__left">
    @if (showBreadcrumb()) {
      <app-context-breadcrumb
        layout="season"
        [troupeName]="troupeName()!"
        [troupeSlug]="troupeSlug()!"
        [seasonTitle]="seasonTitle()"
        [seasonSlug]="seasonSlug()"
      />
    }
  </div>
  <div class="season-header__right">
    @if (user(); as u) {
      <button
        type="button"
        mat-stroked-button
        class="season-header__user"
        [matMenuTriggerFor]="userMenu"
        [attr.aria-label]="'Menu compte : ' + userDisplayLabel()"
      >
        <app-user-avatar
          class="season-header__user-avatar"
          [style.--user-avatar-size.px]="24"
          [displayName]="userDisplayLabel()"
          [avatarUrl]="u.avatarUrl ?? null"
          [size]="24"
          [clickable]="true"
          (avatarClick)="openSelfProfile()"
        />
        <span class="season-header__user-label">{{ userDisplayLabel() }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <a mat-menu-item routerLink="/compte">Mon compte</a>
        <button mat-menu-item type="button" (click)="logout()">Se déconnecter</button>
      </mat-menu>
    }
  </div>
</header>
