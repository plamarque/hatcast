<div class="season">
  @if (loadingSession()) {
    <p class="season__status" role="status">Vérification de la session…</p>
  } @else if (loadingSeason()) {
    <div class="season__spinner" role="status">
      <mat-spinner diameter="40" />
    </div>
  } @else if (!season()) {
    <p class="season__empty">Saison introuvable.</p>
  } @else if (season(); as se) {
    <app-season-header
      [seasonTitle]="se.title"
      [seasonSlug]="slug()"
      [seasonId]="se.id"
      [troupeId]="troupeId()!"
      [troupeName]="troupeName()"
      [troupeSlug]="troupeSlug()"
      [troupeLogoUrl]="troupeLogoUrl()"
      [adminItems]="seasonAdminItems()"
    />

    <app-season-view-toolbar
      [(seasonView)]="seasonView"
      [seasonId]="se.id"
      [filterTriggerVisible]="filterTriggerVisible()"
      [participantOptions]="participantOptions()"
      [(selectedParticipantIds)]="selectedParticipantIds"
      [eventOptions]="eventFilterOptions()"
      [(selectedEventIds)]="selectedEventIds"
      [historyEventOptions]="historyEventFilterOptions()"
      [(selectedHistoryEventIds)]="selectedHistoryEventIds"
      [statsEventOptions]="statsEventFilterOptions()"
      [(selectedStatsEventIds)]="selectedStatsEventIds"
      [categoryGlossarySlugs]="categoryGlossarySlugs()"
      [categoryLabels]="categoryLabels()"
      [statsCategoryFilter]="statsCategoryFilter()"
      (statsCategoryFilterChange)="onStatsCategoryFilterChange($event)"
      [(detailsExpanded)]="statsDetailsExpanded"
    />

    @if (seasonView() === 'agenda') {
      <app-season-agenda
        [monthGroups]="monthGroups()"
        [loading]="loadingEvents()"
        [truncated]="eventsTruncated()"
        [totalElements]="totalElements()"
        [loadedEventsCount]="events().length"
        [canManageEvents]="canManageEvents()"
        [canEditAvailability]="canEditAvailability()"
        [categoryLabels]="categoryLabels()"
        (eventClick)="openEvent($event)"
        (loadMoreClick)="loadMoreEvents()"
        (availabilityClick)="openAvailability($event)"
      />
    } @else if (seasonView() === 'history') {
      <app-season-agenda
        variant="history"
        [monthGroups]="historyMonthGroups()"
        [loading]="loadingPastEvents()"
        [truncated]="pastEventsTruncated()"
        [totalElements]="pastTotalElements()"
        [loadedEventsCount]="pastEvents().length"
        [filtersExcludeAll]="historyFiltersExcludeAll()"
        [categoryLabels]="categoryLabels()"
        (eventClick)="openEvent($event)"
        (loadMoreClick)="loadMorePastEvents()"
      />
    } @else {
      <app-season-statistics
        [data]="displayStatisticsData()"
        [loading]="loadingStatistics()"
        [emptyReason]="statisticsEmptyReason()"
        [detailsExpanded]="statsDetailsExpanded()"
        [troupeId]="troupeId()"
        [seasonId]="se.id"
      />
    }
  }
</div>
