<div class="member-glance-page">
  <header class="member-glance-page__header">
    <div class="member-glance-page__titles">
      <h1 class="member-glance-page__title">{{ headerTitle() }}</h1>
      <p class="member-glance-page__subtitle">{{ headerSubtitle() }}</p>
    </div>
  </header>

  @if (filterBarVisible() && filterBarCatalog()) {
    <app-user-agenda-filter-bar
      class="member-glance-page__filters"
      [participationFilters]="filterBarCatalog()!"
      [selectedTroupeId]="selectedTroupeId()"
      [selectedSeasonId]="selectedSeasonId()"
      (troupeChange)="onTroupeFilterChange($event)"
      (seasonChange)="onSeasonFilterChange($event)"
      (clearFilters)="onClearFilters()"
    />
  }

  <main class="member-glance-page__main" aria-labelledby="member-glance-main-title">
    <h2 id="member-glance-main-title" class="visually-hidden">{{ pageTitle() }}</h2>

    @if (loadingSession() || loadingGlance()) {
      <div class="member-glance-page__loading" role="status">
        <mat-spinner diameter="40" />
      </div>
    } @else if (loadError()) {
      <p class="member-glance-page__error" role="alert">Impossible de charger le profil saison.</p>
    } @else if (panelProfile(); as profile) {
      <app-member-profile-panel [profile]="profile" [loading]="false" [showPreferredRoles]="false" />
    }
  </main>
</div>
