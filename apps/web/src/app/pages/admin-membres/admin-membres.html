<div class="admin-membres">
  <header class="admin-membres__header">
    <div class="admin-membres__header-left">
      @if (showBreadcrumb()) {
        <app-context-breadcrumb
          layout="troupe"
          leafTitle="Membres"
          [troupeName]="troupeName()!"
          [troupeSlug]="troupeSlug()!"
        />
      }
    </div>
    @if (user(); as u) {
      <button
        type="button"
        mat-stroked-button
        class="admin-membres__user"
        [matMenuTriggerFor]="userMenu"
        [attr.aria-label]="'Menu compte : ' + userDisplayLabel()"
      >
        <app-user-avatar
          class="admin-membres__user-avatar"
          [style.--user-avatar-size.px]="24"
          [displayName]="userDisplayLabel()"
          [avatarUrl]="u.avatarUrl ?? null"
          [size]="24"
        />
        <span class="admin-membres__user-label">{{ userDisplayLabel() }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <a mat-menu-item routerLink="/compte">Mon compte</a>
      </mat-menu>
    }
  </header>

  @if (showBreadcrumb()) {
    <div class="admin-membres__mobile-context">
      <h1 class="admin-membres__mobile-context-title">Membres</h1>
    </div>
  }

  @if (loading()) {
    <div class="admin-membres__spinner" role="status">
      <mat-spinner diameter="40" />
    </div>
  } @else if (troupeId() && isTroupeAdmin()) {
    <app-membres-tab
      [troupeId]="troupeId()!"
      [profileSeasonId]="profileSeasonId()"
      [profileSeasonSlug]="profileSeasonSlug()"
    />
  }
</div>
