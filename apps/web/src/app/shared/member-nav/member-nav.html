<div class="member-nav">
  <div class="member-nav__desktop-column">
    <mat-nav-list class="member-nav__rail" role="navigation" aria-label="Navigation principale membre">
    <a
      mat-list-item
      class="member-nav__rail-link"
      routerLink="/accueil"
      routerLinkActive="member-nav__link--active"
      #accueilRailRla="routerLinkActive"
      [attr.aria-label]="accueilAriaLabel()"
      [attr.aria-current]="accueilRailRla.isActive ? 'page' : null"
    >
      <span class="member-nav__rail-item">
        <span class="member-nav__rail-icon-wrap">
          <mat-icon aria-hidden="true">home</mat-icon>
          @if (accueilBadgeLabel()) {
            <span class="member-nav__badge member-nav__badge--overlay" aria-hidden="true">
              {{ accueilBadgeLabel() }}
            </span>
          }
        </span>
        <span class="member-nav__rail-label">Accueil</span>
      </span>
    </a>
    <a
      mat-list-item
      class="member-nav__rail-link"
      routerLink="/agenda"
      routerLinkActive="member-nav__link--active"
      #agendaRailRla="routerLinkActive"
      aria-label="Mon agenda"
      [attr.aria-current]="agendaRailRla.isActive ? 'page' : null"
    >
      <span class="member-nav__rail-item">
        <span class="member-nav__rail-icon-wrap">
          <mat-icon aria-hidden="true">calendar_month</mat-icon>
        </span>
        <span class="member-nav__rail-label">Mon agenda</span>
      </span>
    </a>
    <a
      mat-list-item
      class="member-nav__rail-link"
      [routerLink]="statsShortcut.link()"
      [class.member-nav__link--active]="isStatsTabActive()"
      aria-label="Mes stats"
      [attr.aria-current]="isStatsTabActive() ? 'page' : null"
    >
      <span class="member-nav__rail-item">
        <span class="member-nav__rail-icon-wrap">
          <mat-icon aria-hidden="true">insights</mat-icon>
        </span>
        <span class="member-nav__rail-label">Mes stats</span>
      </span>
    </a>
    <a
      mat-list-item
      class="member-nav__rail-link"
      [routerLink]="troupeShortcut.link()"
      [class.member-nav__link--active]="isTroupeTabActive()"
      aria-label="Ma troupe"
      [attr.aria-current]="isTroupeTabActive() ? 'page' : null"
    >
      <span class="member-nav__rail-item">
        <span class="member-nav__rail-icon-wrap">
          <mat-icon aria-hidden="true">groups</mat-icon>
        </span>
        <span class="member-nav__rail-label">Ma troupe</span>
      </span>
    </a>
    </mat-nav-list>

    <footer class="member-nav__account-footer">
      <app-member-account-menu-trigger variant="rail-footer" />
    </footer>
  </div>

  <nav
    mat-tab-nav-bar
    class="member-nav__bottom"
    [tabPanel]="bottomPanel"
    aria-label="Navigation principale membre"
  >
    <a
      mat-tab-link
      routerLink="/accueil"
      routerLinkActive
      #accueilRla="routerLinkActive"
      [active]="accueilRla.isActive"
      [attr.aria-label]="accueilAriaLabel()"
      [attr.aria-current]="accueilRla.isActive ? 'page' : null"
    >
      <span class="member-nav__bottom-item">
        <span class="member-nav__bottom-icon-wrap">
          <mat-icon aria-hidden="true">home</mat-icon>
          @if (accueilBadgeLabel()) {
            <span class="member-nav__badge member-nav__badge--overlay" aria-hidden="true">
              {{ accueilBadgeLabel() }}
            </span>
          }
        </span>
        <span class="member-nav__bottom-label">Accueil</span>
      </span>
    </a>
    <a
      mat-tab-link
      routerLink="/agenda"
      routerLinkActive
      #agendaRla="routerLinkActive"
      [active]="agendaRla.isActive"
      aria-label="Mon agenda"
      [attr.aria-current]="agendaRla.isActive ? 'page' : null"
    >
      <span class="member-nav__bottom-item">
        <mat-icon aria-hidden="true">calendar_month</mat-icon>
        <span class="member-nav__bottom-label">Mon agenda</span>
      </span>
    </a>
    <a
      mat-tab-link
      [routerLink]="statsShortcut.link()"
      [active]="isStatsTabActive()"
      aria-label="Mes stats"
      [attr.aria-current]="isStatsTabActive() ? 'page' : null"
    >
      <span class="member-nav__bottom-item">
        <mat-icon aria-hidden="true">insights</mat-icon>
        <span class="member-nav__bottom-label member-nav__bottom-label--truncate">Mes stats</span>
      </span>
    </a>
    <a
      mat-tab-link
      [routerLink]="troupeShortcut.link()"
      [active]="isTroupeTabActive()"
      aria-label="Ma troupe"
      [attr.aria-current]="isTroupeTabActive() ? 'page' : null"
    >
      <span class="member-nav__bottom-item">
        <mat-icon aria-hidden="true">groups</mat-icon>
        <span class="member-nav__bottom-label">Ma troupe</span>
      </span>
    </a>
  </nav>
  <mat-tab-nav-panel #bottomPanel class="member-nav__bottom-panel" />
</div>
