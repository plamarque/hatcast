@if (loading()) {
  <div class="member-profile__loading" role="status">
    <mat-spinner diameter="40" />
  </div>
} @else if (profile(); as p) {
  <div class="member-profile">
    <header class="member-profile__header">
      <app-user-avatar
        class="member-profile__avatar"
        [style.--user-avatar-size.px]="56"
        [displayName]="p.displayName"
        [avatarUrl]="p.avatarUrl"
        [gender]="p.gender ?? null"
        [size]="56"
      />
      <div class="member-profile__identity">
        <h2 mat-dialog-title class="member-profile__name">{{ p.displayName }}</h2>
      </div>
      <button
        type="button"
        mat-icon-button
        class="member-profile__close"
        aria-label="Fermer"
        (click)="close()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <mat-dialog-content class="member-profile__content">
      <app-member-profile-panel
        [profile]="p"
        [loading]="false"
        [saving]="saving()"
        [selectedRoleKeys]="selectedRoleKeys()"
        (preferredRolesChange)="onPreferredRolesChange($event)"
        (savePreferredRoles)="savePreferredRoles()"
      />
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="member-profile__footer">
      <button
        type="button"
        mat-stroked-button
        aria-label="Voir dans mon agenda avec les filtres actuels"
        (click)="openFilteredAgenda()"
      >
        Voir dans mon agenda
      </button>
      <button type="button" mat-flat-button color="primary" (click)="close()">Fermer</button>
    </mat-dialog-actions>
  </div>
}
