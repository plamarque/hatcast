<div
  class="filter-picker-shell"
  [class.filter-picker-shell--sheet]="isBottomSheet"
  [class.filter-picker-shell--dialog]="!isBottomSheet"
>
  <app-hatcast-picker-header
    title="Filtrer les catégories"
    [surface]="isBottomSheet ? 'sheet' : 'dialog'"
    (close)="close()"
  />

  <div class="filter-picker-shell__list filter-picker-shell__list--categories">
    <app-filter-dimension-categories
      [value]="draft()"
      [glossarySlugs]="data.glossarySlugs"
      [labels]="data.labels"
      (valueChange)="onCategoriesChange($event)"
    />
  </div>

  <div class="filter-picker-shell__footer">
    <button mat-button type="button" data-testid="categories-picker-reset" (click)="onReset()">
      Réinitialiser
    </button>
    @if (!isBottomSheet) {
      <app-hatcast-dialog-dismiss label="annuler" testId="categories-picker-cancel" (clicked)="close()" />
    }
    <button mat-flat-button color="primary" type="button" data-testid="categories-picker-apply" (click)="onApply()">
      Appliquer
    </button>
  </div>
</div>
