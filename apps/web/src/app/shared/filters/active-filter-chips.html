@if (chips().length > 0) {
  <div class="active-filter-chips" data-testid="active-filter-chips">
    <mat-chip-set aria-label="Filtres actifs">
      @for (chip of chips(); track chip.dimensionKey) {
        <mat-chip
          [removable]="isRemovable(chip.dimensionKey)"
          (removed)="onRemove(chip.dimensionKey)"
          (click)="onChipClick(chip.dimensionKey)"
        >
          {{ chip.label }}
          @if (isRemovable(chip.dimensionKey)) {
            <button
              matChipRemove
              type="button"
              [attr.aria-label]="'Retirer le filtre ' + chip.label"
              (click)="$event.stopPropagation()"
            >
              <mat-icon>cancel</mat-icon>
            </button>
          }
        </mat-chip>
      }
    </mat-chip-set>
    @if (hasRemovableChips()) {
      <button
        mat-button
        type="button"
        class="active-filter-chips__clear"
        data-testid="filter-clear-all"
        (click)="onClearAll()"
      >
        Tout effacer
      </button>
    }
  </div>
}
