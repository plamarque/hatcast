<div
  class="filter-picker-shell"
  [class.filter-picker-shell--sheet]="isBottomSheet"
  [class.filter-picker-shell--dialog]="!isBottomSheet"
>
  <app-hatcast-picker-header
    [title]="data.dimension.title"
    [surface]="isBottomSheet ? 'sheet' : 'dialog'"
    (close)="close()"
  />

  <div class="filter-picker-shell__list filter-picker-shell__list--single">
    <app-filter-dimension-single
      [dimension]="effectiveDimension()"
      [selectedId]="draftId()"
      (selectionChange)="onSelect($event)"
    />
  </div>

  @if (data.isMobile) {
    <div class="filter-picker-shell__footer">
      <button mat-button type="button" data-testid="single-picker-reset" (click)="onReset()">
        Réinitialiser
      </button>
      <button mat-flat-button color="primary" type="button" data-testid="single-picker-apply" (click)="onApply()">
        Appliquer
      </button>
    </div>
  } @else {
    <div class="filter-picker-shell__footer">
      <app-hatcast-dialog-dismiss label="annuler" testId="single-picker-cancel" (clicked)="close()" />
    </div>
  }
</div>
