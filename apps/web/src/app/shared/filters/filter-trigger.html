@if (visible()) {
  <button
    type="button"
    mat-icon-button
    class="filter-trigger"
    [class.filter-trigger--warn]="warn()"
    data-testid="filter-trigger"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="expanded()"
    (click)="onOpen()"
  >
    <mat-icon aria-hidden="true">filter_list</mat-icon>
  </button>
}
