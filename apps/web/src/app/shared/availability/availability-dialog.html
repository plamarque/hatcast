<h2 mat-dialog-title cdkFocusInitial>
  Disponibilité de {{ data.subjectDisplayName }}
</h2>

<mat-dialog-content class="availability-dialog">
  <div class="availability-dialog__context">
    <p class="availability-dialog__event-title">{{ data.eventTitle }}</p>
    <p class="availability-dialog__event-date">{{ formattedDate }}</p>
  </div>

  <app-availability-form
    [seasonId]="data.seasonId"
    [eventId]="data.eventId"
    [troupeId]="data.troupeId"
    [roleSlots]="data.roleSlots"
    [subjectDisplayName]="data.subjectDisplayName"
    [initialStatus]="data.initialStatus"
    [initialRoleKeys]="data.initialRoleKeys"
    [initialComment]="data.initialComment"
    (saved)="onSaved()"
  />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Fermer</button>
</mat-dialog-actions>
