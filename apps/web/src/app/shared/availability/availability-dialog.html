<h2 mat-dialog-title cdkFocusInitial tabindex="-1">
  Indique tes disponibilités
</h2>

<mat-dialog-content class="availability-dialog">
  <div class="availability-dialog__context">
    <p class="availability-dialog__event-title">{{ data.eventTitle }}</p>
    <p class="availability-dialog__event-date">{{ formattedDate }}</p>
  </div>

  <app-availability-form
    [externalSubmit]="true"
    [seasonId]="data.seasonId"
    [eventId]="data.eventId"
    [troupeId]="data.troupeId"
    [roleSlots]="data.roleSlots"
    [subjectDisplayName]="data.subjectDisplayName"
    [initialStatus]="data.initialStatus"
    [initialRoleKeys]="data.initialRoleKeys"
    [initialComment]="data.initialComment"
    [availabilityOpenedAt]="data.availabilityOpenedAt ?? null"
    (saved)="onSaved($event)"
  />
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (form()?.validationMessage(); as message) {
    <p class="availability-dialog__dirty-hint availability-dialog__error" role="alert">{{ message }}</p>
  } @else if (form()?.detailsDirty()) {
    <p class="availability-dialog__dirty-hint" role="status">Modifications non enregistrées</p>
  }
  <app-hatcast-dialog-dismiss label="annuler" [disabled]="form()?.saving() ?? false" (clicked)="close()" />
  <button mat-flat-button type="button" [disabled]="form()?.saving()" (click)="form()?.submit()">
    {{ form()?.saving() ? 'Enregistrement…' : 'Enregistrer' }}
  </button>
</mat-dialog-actions>
