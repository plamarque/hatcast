@if (proxyMode()) {
  <div class="availability-moi-panel__proxy-banner" role="status">
    <mat-icon class="availability-moi-panel__proxy-icon" aria-hidden="true">warning</mat-icon>
    <div class="availability-moi-panel__proxy-text">
      <p class="availability-moi-panel__proxy-title">
        Saisie pour le compte de {{ subject().displayName }}
      </p>
      <p class="availability-moi-panel__proxy-detail">
        Le statut s'enregistre tout de suite&nbsp;; rôles et commentaire via le bouton
        d'enregistrement. Tout s'applique à ce·tte membre, pas à votre compte.
      </p>
    </div>
  </div>
}
<app-availability-form
  [seasonId]="seasonId()"
  [eventId]="eventId()"
  [troupeId]="troupeId()"
  [roleSlots]="roleSlots()"
  [subjectDisplayName]="subject().displayName"
  [subjectParticipantId]="subject().participantId"
  [subjectGender]="subject().gender"
  [readOnly]="readOnly()"
  [proxyMode]="proxyMode()"
  [archived]="archived()"
  [initialStatus]="subject().status"
  [initialRoleKeys]="subject().roleKeys"
  [initialComment]="subject().comment"
  [availabilityOpenedAt]="availabilityOpenedAt()"
  (saved)="saved.emit($event)"
/>
