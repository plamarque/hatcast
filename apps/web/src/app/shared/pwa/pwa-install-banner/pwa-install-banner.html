@if (pwaInstall.showBanner()) {
  <app-pwa-system-banner
    stackLayer="install"
    ariaLabel="Installation de l'application"
    title="HatCast"
    subtitle="Installez l'app pour une meilleure expérience"
    primaryLabel="Installer"
    primaryActionAriaLabel="Installer HatCast"
    dismissTestId="pwa-install-banner-dismiss"
    dismissAriaLabel="Fermer la barre d'installation"
    (mainClick)="onInstallClick()"
    (primaryClick)="onInstallClick()"
    (dismissClick)="onDismissClick()"
  />
}
