@if (items().length > 0) {
  @if (useStrokedTrigger()) {
    <button
      type="button"
      mat-stroked-button
      class="scope-admin-menu__trigger scope-admin-menu__trigger--stroked"
      [matMenuTriggerFor]="adminMenu"
      [attr.aria-label]="triggerAriaLabel()"
    >
      <mat-icon aria-hidden="true">settings</mat-icon>
      @if (triggerLabel()?.trim(); as label) {
        <span class="scope-admin-menu__trigger-label">{{ label }}</span>
      }
    </button>
  } @else {
    <button
      type="button"
      mat-icon-button
      class="scope-admin-menu__trigger"
      [matMenuTriggerFor]="adminMenu"
      [attr.aria-label]="triggerAriaLabel()"
    >
      <mat-icon aria-hidden="true">settings</mat-icon>
    </button>
  }

  <mat-menu #adminMenu="matMenu" class="scope-admin-menu__panel">
    @for (item of items(); track item.label) {
      @if (item.routerLink) {
        <a
          mat-menu-item
          [routerLink]="item.routerLink"
          [queryParams]="item.queryParams ?? null"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      } @else {
        <button mat-menu-item type="button" (click)="item.action?.()">
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </button>
      }
    }
  </mat-menu>
}
