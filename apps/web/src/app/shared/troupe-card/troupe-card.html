<mat-card class="troupe-card" appearance="outlined">
  <div class="troupe-card__body">
    <div class="troupe-card__header">
      <span class="troupe-card__logo" aria-hidden="true">
        <mat-icon>groups</mat-icon>
      </span>
      <h3 class="troupe-card__name">{{ name() }}</h3>
    </div>
    <p class="troupe-card__stat">{{ memberLabel(memberCount()) }}</p>
    <p class="troupe-card__stat">{{ upcomingLabel(upcomingCount()) }}</p>
  </div>

  <mat-card-actions class="troupe-card__actions">
    @if (mode() === 'discover' && discoverAction() === 'login') {
      <button
        mat-flat-button
        color="primary"
        type="button"
        [attr.aria-label]="openAriaLabel()"
        (click)="onDiscoverLogin()"
      >
        Voir
      </button>
    } @else {
      <a
        mat-flat-button
        color="primary"
        [routerLink]="hubLink(slug())"
        [attr.aria-label]="openAriaLabel()"
      >
        {{ mode() === 'discover' ? 'Voir' : 'Ouvrir' }}
      </a>
    }
  </mat-card-actions>
</mat-card>
