@if (showImage()) {
  <img
    class="user-avatar__img"
    [src]="avatarUrl()"
    [style.width.px]="size()"
    [style.height.px]="size()"
    [attr.alt]="'Photo de ' + displayName()"
    loading="lazy"
    (error)="onImageError()"
  />
} @else {
  <span class="user-avatar__initial" aria-hidden="true">{{ initial() }}</span>
}
