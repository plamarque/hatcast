<a
  mat-stroked-button
  [routerLink]="shortcut.link()"
  class="member-cross-nav__btn member-cross-nav__btn--season"
  [class.member-cross-nav__btn--pending]="shortcut.loading()"
  [attr.aria-label]="shortcut.ariaLabel()"
  [attr.aria-busy]="shortcut.loading() ? 'true' : null"
>
  <mat-icon aria-hidden="true">groups</mat-icon>
  <span class="member-cross-nav__label member-cross-nav__season-title">{{ shortcut.label() }}</span>
</a>
