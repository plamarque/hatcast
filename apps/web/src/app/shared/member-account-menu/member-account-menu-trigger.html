@if (visible()) {
  @if (variant() === 'rail-footer') {
    <button
      type="button"
      mat-button
      class="member-account-menu-trigger member-account-menu-trigger--rail"
      [matMenuTriggerFor]="accountMenu"
      (menuOpened)="accountItems.refreshPreviewCapability()"
      [attr.aria-label]="accountAriaLabel()"
    >
      <span class="member-account-menu-trigger__rail-item">
        <span class="member-account-menu-trigger__rail-icon-wrap">
          <app-user-avatar
            class="member-account-menu-trigger__avatar"
            [style.--user-avatar-size.px]="24"
            [displayName]="railLabel()"
            [avatarUrl]="sessionUser()?.avatarUrl ?? null"
            [gender]="memberDisplayName.avatarGender()"
            [size]="24"
          />
        </span>
        <span class="member-account-menu-trigger__rail-label">{{ railLabel() }}</span>
      </span>
    </button>
  } @else {
    <button
      type="button"
      mat-icon-button
      class="member-account-menu-trigger member-account-menu-trigger--shell-icon"
      [matMenuTriggerFor]="accountMenu"
      (menuOpened)="accountItems.refreshPreviewCapability()"
      [attr.aria-label]="accountAriaLabel()"
    >
      <app-user-avatar
        class="member-account-menu-trigger__avatar"
        [style.--user-avatar-size.px]="32"
        [displayName]="railLabel()"
        [avatarUrl]="sessionUser()?.avatarUrl ?? null"
        [gender]="memberDisplayName.avatarGender()"
        [size]="32"
      />
    </button>
  }

  <mat-menu #accountMenu="matMenu" yPosition="above">
    <app-user-account-menu-items #accountItems [showLogout]="effectiveShowLogout()" />
  </mat-menu>
}
